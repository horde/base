    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "[gwr] Added a script for exporting/importing preferences from/to a backend.\n[mms] Fix regression with UTF7-IMAP encoding of non-ascii folder names (Bug #10093).\n[mms] Allow numbers to be zero in certain preferences (Bug #10120).\n[mms] Fix running Horde login tasks (Bug #9767).\n[mms] Fix authenticating as several users in the same request (Bug #10027).\n[mms] Fix colorpicker on categories preferences screen (Bug #10118).\n[jan] Update Spanish translation.\n[jan] Update Slovak translation.\n[mjr] Fix Metar portal block.\n[gwr] Add support for the Kolab IMAP based preferences backend.\n[mms] Complete fix for issue causing slow syncs only (Bug #10008).\n"
4.0.3:
  api: 4.0.0
  state:
    release: stable
    api: stable
  date: 2011-05-18
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "[mjr] Fix usage of countOwners() and listOwners() in the Sqlng driver.\n[mms] Fix return link after reporting problem (Bug #10069).\n[jan] Add button to update all configurations with default values at once.\n[jan] Update DataTree conversion scripts for Horde 4.\n[jan] Fix rendering of DataTree browse tree.\n[mjr] Fix issue with deleting identities (Bug #9997).\n[mjr] Fix issue causing credentials to be lost when accessing the API during ActiveSync requests (Bug #9733).\n[jan] Store preferences for guests in the session.\n"
4.0.2:
  api: 4.0.0
  state:
    release: stable
    api: stable
  date: 2011-05-03
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "[jan] SECURITY: Fix permission checks of guest users on system shares.\n[mms] SECURITY: Fix deletion of unwanted HTML nodes in XSS filter.\n[mms] Fix authentication failure when TOS is not accepted.\n[jan] Don't show IMP compose link if user doesn't have permissions to IMP (Bug #10016).\n[mms] Fix issue causing slow syncs only in SyncML (Bug #10008).\n[jan] Fix adding categories.\n[jan] Fix listing users in Customsql driver (Bug #9963).\n[jan] Fix calculation of last password change in LDAP account portal block (Bug #9770).\n[jan] Don't check for outdated DB schemas if database support is disabled (Bug #9986).\n[mjr] Fix editing settings of fixed portal blocks (Bug #9910).\n"
4.0.1:
  api: 4.0.0
  state:
    release: stable
    api: stable
  date: 2011-04-20
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "[mjr] Fix the blockTitle and blockContent API methods.\n[jan] Fix creating folders with SQL VFS driver (Bug #9894).\n[jan] Fix LDAP parameters of account portal block (Klaus Steinberger, Bug #9770).\n[jan] Fix migration detection on Windows.\n[mjr] Correctly sanitize DSN when using custom cyrus auth driver (Bug #9879).\n[mjr] Fix some display issues when geocoding with HordeMap (Bug #9883).\n[mms] Don't load sidebar content if not expanded.\n[jan] Fix deleting groups.\n[jan] Fix adding new groups (Bug #9881).\n[jan] Fix displaying the Facebook preference group.\n[mms] Add appinitialized hook.\n[cjh] Fix cyrsql configuration, rename cyrus host and port parameters to not clash with Horde_Db parameters (Bug #9864).\n[cjh] Fix signups, and update style on signup and reset password pages to match the login page (Bug #9856, partially from Ian Roth <iron_hat@hotmail.com>).\n[cjh] Show an unknown app icon rather than a broken image if an application doesn't have an icon (Bug #9867).\n[jan] Fix setting incorrect database charset in PDO drivers.\n"
4.0.0:
  api: 4.0.0
  state:
    release: stable
    api: stable
  date: 2011-04-06
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "[mms] Add pushapp_post hook.\n[jan] Fix application-specific permission checks (Bug #9786).\n[jan] Fix resetting passwords (Vilius Sumskas <vilius@lnk.lt>, Bug #9800).\n[jan] Fix Cyrsql authentication driver (Vilius Sumskas <vilius@lnk.lt>, Bug #9781).\n[mjr] Fix ActiveSync provisioning.\n[mjr] Fix for broken Nokia MfE clients (Bug #9757).\n[jan] Move all executable upgrade scripts to bin/ and prefix with horde-.\n[jan] Delete object mappings too when deleting SyncML anchors (Request #9377).\n[jan] Delay sidebar creation if the sidebar is generated through JavaScript.\n"
4.0.0-RC2:
  api: 4.0.0
  state:
    release: beta
    api: beta
  date: 2011-03-29
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "Original version string was 4.0.0RC2\n[jan] Fix incorrect lowercasing of objectClasses in LDAP groups driver.\n[jan] Fix fatal error in desktop notifications (Bug #9727).\n[jan] Rename all scripts in bin/ to be prefixed with horde- and installed in PEAR's bin_dir (Request #9647).\n[jan] Don't throw exception when setting port number while using localhost in MySQL configuration (Bug #9738).\n[jan] Fix building LDAP filter for groups from configuration (Bug #9739).\n[jan] Fix loading of Horde's vhost conf.php file (Bug #9704).\n[jan] Fix OpenOffice MIME viewer.\n[jan] Fire access keys on hidden elements in Internet Explorer (Bug #8057).\n[jan] Don't fire access keys twice in Chrome browsers.\n[jan] Fix JavaScript date calculations across DST boundaries.\n[jan] Sort applications in preference menu by name.\n[jan] Add translations for file upload error messages.\n[mms] Fix identities pref UI when default_identity is locked (Bug #9701).\n[mms] Added Horde::debug().\n"
4.0.0-RC1:
  api: 4.0.0
  state:
    release: beta
    api: beta
  date: 2011-03-23
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "Original version string was 4.0.0RC1\nFirst release candidate for Horde 4.\n[jan] Update installation and upgrade instructions.\n[jan] Fix converting identities with non-ascii characters to new format.\n[jan] Fix passing arguments to sendmail binary (Gonçalo Queirós, Bug #9693).\n[mjr] Service_Facebook refactored for OAuth2 authentication (Bug #9122).\n[mjr] IMSP drivers refactored for Horde 4.\n[gwr] Allow disabling applications for administrators.\n[jan] Don't show sub-permissions for adding that exist already.\n[jan] Fix listing more than one sub-permission (Bug #9671).\n[jan] Fix calendar synchronization with certain Nokia phones (Bug #9646).\n"
4.0.0-beta1:
  api: 4.0.0
  state:
    release: beta
    api: beta
  date: 2011-03-16
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "Original version string was 4.0.0beta1\n[jan] Catch fatal errors about missing tables during initial configuration.\n[mms] Fix client-side IMAP sorting using envelope data.\n[mms] Workaround PHP < 5.2.6 (broken stream handling) (Bug #9644).\n[mjr] Fix updating schema for individual libraries.\n[mjr] Improved control over which application view to load.\n[jan] Find translateable strings in configuration files.\n[mms] Fix clearing expanded state for javascript trees (Bug #9659).\n[jan] Only show advanced preferences link if there are some.\n[mms] Fix updates for refreshing Blocks (Bug #9655).\n[mjr] Fix viewing applications with no mobile view from mobile devices.\n[jan] Fix error when not using a Group backend. (Bug #9642).\n"
4.0.0-alpha1:
  api: 4.0.0
  state:
    release: alpha
    api: alpha
  date: 2011-03-09
  license:
    identifier: LGPL-2
    uri: http://www.horde.org/licenses/lgpl
  notes: "Original version string was 4.0.0alpha1\nFirst alpha release for Horde 4.\n[jan] Provide default configuration files instead of .dist versions.\n[jan] Add a new Share SQL driver with better performance.\n[cjh] Drop Log SQL driver.\n[mms] Update prototypejs to v1.7.\n[mms] Add theme caching.\n[mms] Add hook to allow browser capabilities to be modified.\n[jan] Add a configuration switch for automatic creation of default shares.\n[cjh] Move from Net_DNS to Net_DNS2.\n[jan] Translations for the framework packages are now bundled with those packages.\n[bak] Remove LDAP driver from Horde_SessionHandler\n[jan] Require mandatory UTF-8 support for both servers and clients.\n[jan] Renamed Setup to Configuration and Options to Preferences.\n[mms] Moved sidebar code out of block/portal code (Request #9160).\n[cjh] Remove fckeditor, standardizing on ckeditor.\n[jan] Move all translations from po/ to locale/ and use short locale identifiers where possible.\n[jan] Remove frameset.\n[jan] Remove dhtmlHistory library.\n[mms] Removed support for krb5 authentication driver.\n[jan] Allow to specify the URL parameter name for the alternate login setting.\n[mms] Remove reliance on PEAR Mail library.\n[jan] Send alarm emails again if the alarm has changed (Bug #8717).\n[mms] Add advanced preferences options screen.\n[mms] Complete rewrite of preferences UI display.\n[mjr] Horde_Image can now act as an Iterator for multi-page images.\n[mms] Remove Horde_Cipher library.\n[mms] Add 'cssfiles' hook to add custom CSS files to a page.\n[jan] Add configuration to not automatically show all available shares.\n[jan] Add configuration to disallow world permissions for user shares.\n[jan] Store alarm dates in UTC (Bug #8381).\n[mms] Add abstracted AJAX interface (Request #4561).\n[mms] Update scriptaculous to v1.8.3.\n[mjr] Add Horde_Image_Exif (ported from Ansel) and add a exiftool driver.\n[mjr] Horde_Image now has a native Imagick driver (removed proxy code).\n[mms] All Horde login/authentication handled by single login page.\n[mms] Move imple processing to a Horde service.\n[mms] Refactor Maintenance:: -> Horde_LoginTasks::.\n[mms] In Postgres, horde_prefs table now stores data in BYTEA instead of TEXT (Bug #8130).\n[mms] Improved caching of Registry data significantly reduces session sizes and total session storage requirements (Request #8024).\n[mms] IMAP auth driver now uses Horde_Imap_Client library.\n[mms] Use Gnumeric package to render MS Excel files.\n[mms] Use AbiWord package to render MS Word files.\n[cjh] Remove sapdb session handler backend.\n[jan] Add share locking (Alfonso Marín Marín <almarin@um.es>).\n[cjh] Remove javascript popup alarms.\n[cjh] Update the Auth_passwd driver's add/update/remove user implementations (Bug #7810).\n[cjh] Add a Horde_Routes dispatcher for Rampage applications.\n[mjr] Fix a possible infinite loop with certain recurring events in Horde_Date.\n[jan] Use DateTime internally in Horde_Date.\n"
3.3.12:
  notes: "[jan] Convert charset of group names in SQL driver (Bug #9611).\n[jan] Fix deleting of SyncML anchors if PHP short_open_tag is off (Bug #9349).\n[jan] Add an experimental new Share SQL driver with better performance.\n[jan] Fix integer overflow in ASN.1 parser for S/MIME messages.\n[jan] Fix splitread database usage in VFS (Bug #9467).\n[jan] Fix invalidating permission cache in SQL driver (Bug #9392).\n"
3.3.11:
  notes: "[mms] SECURITY: Fix XSS when viewing details of a vCard.\n[jan] Fix exporting recurrence exceptions to vCalendar 1.0.\n[jan] Skip event status synchronization with Outlook, which is broken.\n[jan] Don't send SIF data to recent Funambol clients, unless requested.\n[jan] Log all queries and errors by the history library.\n"
3.3.10:
  notes: "[jan] Fix searching DataTree elements (groups) if backend charset is different from interface charset (Bug #9323).\n[mms] Fix accessing IMAP ACLs that contain non-alphanumeric characters (Bug #9299).\n[jan] Avoid fatal errors when using DateTime with not properly configured PHP 5.3+ (Bug #9312).\n[jan] Fix importing recurrence exceptions from vCalendar 1.0.\n[mms] Fix preferences management regression (Bug #9289).\n[jan] Fix conversion of all-day events and certain yearly recurring events for Funambol clients.\n[mms] Fix memcache cache regression (Bug #9279).\n[jan] Fix SyncML page sometimes deleting more anchors than selected.\n"
3.3.9:
  notes: "[jan] SECURITY: Add token protection to preference forms.\n[mms] SECURITY: Fix XSS in util/icon_browser.php.\n[mms] Fix generating RFC 2231 parameters with charset information (Bug #9212).\n[mms] On invalid token during logout, redirect to initial page (Bug #7669).\n[mjr] Don't allow fixed blocks to be changed to another type (Bug #9141).\n[jan] Show future alarms in the alarm management screen too.\n[mjr] Fix bug in Horde_Cache that would prevent cache entries from being expired in certain cases, and prevent cache key collisions.\n"
3.3.8:
  notes: "[jan] Fix framework include path.\n"
3.3.7:
  notes: "[mjr] Fix issue in Horde_Image that would cause generated images to lose transparency in certain situations.\n[jan] Allow to update existing identities while requiring email confirmation (Sebastian Rettenberger, Bug #8877).\n[jan] Fix casting errors when using SQL shares and groups on PostgreSQL (Bug #8899).\n[gwr] Allow conf.d style directory configuration overriding (Request #8172).\n[jan] Fix sending alarms to multiple users (Bug #8821).\n[mms] Fix display of S/MIME certificate data (Bug #8826).\n[mjr] Fix bug in Horde_Image that caused polaroid effect to fail on really old ImageMagick versions (earlier then 6.3.2).\n[jan] Work around Funambol clients requiring a \"configuration\" database (Bug #8621).\n[jan] Add support for synchronizing only those fields that are supported by the client.\n[jan] Workaround broken PHP number formatting with some locales (Bug #8780).\n"
3.3.6:
  notes: "[mms] SECURITY: Workaround XSS vulnerability in Firefox for data URLs (Bug #8715).\n[jan] SECURITY: Fix XSS in administrator section.\n[jan] Fix alarm system with Oracle backends.\n[mjr] Fix using the removeUserDataFromAllApplications method (Valentin Vidic <valentin.vidic@carnet.hr>, Bug #8754).\n[mjr] Fix checking existing signup requests in the Auth_Signup_datatree driver.\n[jan] Fix syntax of MSSQL scripts (Bug #8664).\n[jan] Export task alarms to Funambol clients (Request #8426).\n[jan] Fix not catching Alt key combinations for access keys on Mac OS.\n[jan] Fix Oracle SQL scripts.\n[jan] Close popup window after saving categories.\n[jan] Check quota when copying files with VFS (Valentin Vidic <valentin.vidic@carnet.hr>, Bug #8643).\n[jan] Add Croatian translation (Matej Vela <matej.vela@carnet.hr>).\n[jan] Fix detecting SyncML message sizes.\n[jan] Fix mapping of elements during synchronization (Bug #8386).\n[mms] Fix potential session writing issues using PHP 5.0.5+.\n[jan] Fix error in PHP 5 SOAP server implementation.\n[mms] Fix updating memcache tracking info upon session destruction (whatdoyouwant@gmail.com, Bug #8626).\n[mjr] Various improvements and fixes to the Net_IMSP driver (noah@lsit.ucsb.edu; Bug #8532, #8533, #8534, and #8535).\n[jan] Export recurrence exceptions to Funambol clients (Alfonso Marín Marín <almarin@um.es>, Request #8065).\n[jan] Export all email addresses to Funambol clients (lst_hoe02@kwsoft.de, Request #8571).\n[jan] Export all fax numbers to Funambol clients (lst_hoe02@kwsoft.de, Request #8618).\n[jan] Fix detecting device information of certain synchronization devices.\n[jan] Fix warnings when listing sessions with Oracle or PEAR DB session handlers (Bug #8601).\n[mas] Fix SessionHandler_sql::getSessionIDs() SQL syntax (moreda@allenta.com, Bug #8600).\n[mas] Fix Horde_SQL::readBlob() on MSSQL (moreda@allenta.com, Bug #8599).\n[mms] Fix prototypejs regression on Internet Explorer (Bug #6590).\n"
3.3.5:
  notes: "[jan] SECURITY: Fix vulnerability in image form fields that allows overwriting of arbitrary local files.\n[cjh] SECURITY: Fix validation of \"number\" type preferences (Bug #8399).\n[mms] SECURITY: Don't display unknown text parts inline (Bug #8311).\n[mms] Upgrade prototype.js to v1.6.1.\n[jan] Use system timezone for timestamps in the logs (Bug #8496).\n[jan] Fix exporting certain weekday recurrence rules to iCalendar (lst_hoe02@kwsoft.de, Bug #8510).\n[jan] Work around crash bug in Funambol clients when synchronizing all-day events (Bug #8474).\n[jan] Fix synchronizing tasks with certain devices (Bug #8506).\n[jan] Workaround synchronizing of messed up categories in Nokia E phones (Bug #7824).\n[jan] Fix synchronizing photos with broken Nokia phones (xk3@mompl.org, Bug #7407).\n[jan] Fix fatal error during synchronization if using certain session handlers (Bug #8443).\n[jan] Improve synchronizing yearly events with Funambol clients (lst_hoe02@kwsoft.de, Request #7790).\n[jan] Destroy session when a CLI script ends (Request #8482).\n[jan] Fix data casting when caching permissions with the DataTree backend (Bug #8435).\n[jan] Pass user's password to the signup_addextra hook.\n[jan] Add removeUserDataFromAllApplications API method (adrieder@sbox.tugraz.at, Request #8454).\n[jan] Catch errors when resetting passwords.\n[jan] Support resetting passwords with composite authentication.\n[mms] Fix memcache issue where it took 1 second to release a lock.\n[mjr] Fix weatherdotcom block always displaying a 5 day forecast (Bug #8357).\n[cjh] Use streams for file transfers in VFS_ssh2 (jives@jives.ixum.net, Request #8323).\n[jan] Send notification messages about new signups with confirmation links.\n[jan] Drop signup_email column from sign-up table.\n[jan] Show photo in vCard viewer if provided as inline vCard data.\n[mjr] Fix issue where pref hooks would not be called for preferences marked as shared and defined outside of the Horde scope.\n[jan] Add configuration whether to show user drop down list or text field in permissions dialog.\n[jan] Export current locale to the environment.\n[jan] Fix unfolding of vCard 2.1/vCalendar 1.0 data.\n"
3.3.4:
  notes: "[jan] Fix rendering of addresslink form fields (Bug #8053).\n[mjr] Fix a botched merge in Horde_Image_gd that was causing an undefined variable notice to be output in the image data.\n"
3.3.4-RC1:
  notes: "Original version string was 3.3.4RC1\n[mjr] Fix an issue that causing users with expired passwords to be allowed to log in with the LDAP Auth driver.\n[jan] Properly handle synchronization requests to non-existant databases.\n[jan] Fix exporting all-day events to Funambol clients (Bugs #4487, #6847).\n[jan] Quote parameter values in iCalendar data if necessary (Gunnar Wrobel, Bug #7758).\n[jan] Detect base64 encoded synchronization data from Blackberry devices (Bugs #6995, #6949).\n[jan] Optionally use Net_DNS for host name lookups (adrieder@sbox.tugraz.at, Request #7374).\n[jan] Add TLS support to LDAP drivers (web@marlboro.edu, Request #7958).\n[jan] Add scope and sizelimit parameters to LDAP authentication driver (dom.lalot@gmail.com, Request #7839).\n[jan] Further improve HTML-to-text filter.\n[jan] Export recurrence end dates as date-time values in iCalendar data to improve compatibility with external clients (Bug #7846).\n[jan] Silence errors messages from iconv_substr() (jens@peino.de, Bug #8128).\n[jan] Don't catch Alt key combinations for access keys on Mac OS.\n[mjr] Fix bitwise clause generation in the sql and hierarchical sql driver. This fixes issues with Oracle and possibly other RDBMS.\n[mjr] Correct numerous bugs in Horde_Image dealing with ImageMagick version inconsistencies.\n[jan] Fix charset conversion in preference hooks (Bug #7489).\n[cjh] Proactively disable allow_url_include in core.php.\n[cjh] Add an index on session_lastmodified to the Horde sessionhandler tables.\n[mjr] Force the use of REQUEST_URI instead of PATH_INFO in Util::getPathInfo() when being served by lighttpd due to issues with case insensitive file systems.\n[cjh] Add support for SSL connections to MySQL databases (BryanRJ@gmail.com, Request #7972).\n[cjh] Fix storing of unlocked preferences set by hooks (manuel@mausz.at, Bug #6822).\n[jan] Highlight color input fields with the color from the picker.\n[jan] Fix importing vCards that have the charset specified in a MIME part (Bug #7816).\n[mms] Ensure all input array entries in String::convertCharset() are properly iterated through (Bug #7828, manuel@mausz.at).\n"
3.3.3:
  notes: "[cjh] SECURITY: Escape output in the tag cloud block (found by Gunnar Wrobel <p@rdus.de>).\n[cjh] SECURITY: Validate the Horde_Image driver name (found by Gunnar Wrobel <p@rdus.de>).\n[cjh] Allow \".\" in phone number fields (Request #7858).\n[cjh] Fix the SQL Share driver closing the global database connection improperly when using PostgreSQL (Bug #7825).\n[jan] Add support for Mozilla Sunbirds snooze properties (Request #7470).\n[cjh] Try iconv_substr() in String::substr() if it's available (duck@obala.net, Request #7826).\n[cjh] Avoid warnings in Perms::getPermissionId with PostgreSQL (Marcus Ryan <marcus@riboflavin.net>, Bug #7750).\n[jan] Fix parsing of LABEL attributes in the vCard viewer.\n"
3.3.2:
  notes: "[mms] Fix prototypejs regression on IE (Bug #6590).\n"
3.3.1:
  notes: "[cjh] SECURITY: Add another check to the XSS filter.\n[jan] Add script to import preferences from SquirrelMail database.\n[cjh] Allow the password file Auth driver to require a specific group.\n[cjh] Use YYYY-MM-DDTHH:MM:SS for Alarm date queries (Bug #7580).\n[jan] Add XPath wrapper to Horde_DOM library.\n[cjh] Don't use executeMultiple in the SQL Share driver when we might reset the connection in between queries (Bug #7542).\n[jan] Fix database XML schema to create all lock table fields (Bug #7433).\n[jan] Fix showing two sidebars after saving the display preference group for the first time (Bug #7475).\n[jan] Fix sharing with LDAP groups (Bug #6883).\n[jan] Add javascript event handler for access keys.\n[cjh] Remove UNSIGNED from PostgreSQL scripts.\n[cjh] Call preference hooks in the scope of the preference (vlukashov (at) parallels (dot) com, Bug #7445).\n[jan] Fix resuming synchronization session on server farms (adrieder@sbox.tugraz.at, Bug #7394).\n[jan] Fix synchronization of tasks with many items (adrieder@sbox.tugraz.at, Bug #7395).\n[mms] Upgrade prototype.js to v1.6.0.3.\n[jwm] Fix regression: SOAP wsdl/disco shouldn't require authorization.\n"
3.3.0:
  notes: "Original version string was 3.3\n[jan] Fix synchronization issues with Blackberry clients (Bug #6949).\n[mms] Fix setting the horde user when using application authentication with realms (Bug #6749).\n[jan] Fix user name conversion with user hooks in the permissions interfaces (Bug #6371).\n[jan] Provide all settings for the read server in split SQL configuration (Request #7024).\n[jan] Improve HTML to text filter.\n[mjr] Hierarchical SQL Share driver now correctly removes all children when removing a share (Bug: 7347).\n[mjr] Fix an issue with various date/time fields in horde form that was causing erroneous validation errors.\n[cjh] Sign parameters to go.php with an HMAC based on a new secret key configuration value, to prevent using go.php as an open referrer.\n[cjh] Make logout tokens only valid for a configurable length of time.\n"
3.3.0-RC1:
  notes: "Original version string was 3.3RC1\n[mms] Fix garbage collection handling on SQL session handler backends.\n[mjr] Change MDB2 sequence names to 'id' in SQL share driver (Bug #7240).\n[cjh] When a URL is supplied for pass-through after logging in, go to that URL in mobile browsers instead of going to the mobile portal (Bug #6332).\n[mms] Memcache session handler no longer writes data with a lifetime.\n[cjh] Add DIMP to the horde LDAP OIDs and hordePerson objectclass (Bug #7243).\n[mms] Update FCKeditor to v2.6.3.\n[jan] Use global mailer configuration when sending alarm emails (adrieder@sbox.tugraz.at, Bug #7058).\n[jan] Reset background colors when resetting the category form (Bug #7226).\n[jan] Improve Funambol contacts support (Requests #7099, #7100).\n[jan] Correctly parse GEO tags in vCard 2.1 data (Bug #6563).\n[jan] Remove Horde portal link from application menus (Bug #7221).\n[cjh] Create a driver for signups, allowing backends other than DataTree (Duck <duck@obala.net>, Request #7161).\n[jan] Fix displaying images with the image form field.\n[mjr] Fix issue with hierarchical SQL share driver that caused permissons to erroneously be denied when the share contained group permissions and was instantiated by a listShares call.\n[mjr] Fix issue with hierarchical SQL share driver that caused any child shares to be orphaned when the parent share was moved in the hierarchy.\n[mjr] Fix issue with SQL share drivers that was causing permission checks to fail under certain conditions by no longer explicitly storing owner permissions in the Perms backend.\n[cjh] Fix overwriting a variable in the tableset_html VarRenderer (Paul Roy <proy@corom.ca>, Bug #7120).\n[mms] Fix MIME encoding when using the ISO-2022-JP charset (Bug #1621).\n[jan] Fix SQL Share driver not using the correct database when using different databases in Horde applications (Bug #6997).\n[cjh] Fix SQL portability in Share_sql driver (Bug #7084).\n[jan] Fix synchronizing large amounts of data split across several SyncML messages.\n[jan] Add Basque translation (Euskal Herriko Unibertsitatea EHU/UPV <xabier.arrieta@ehu.es>).\n[cjh] Fix Horde_Lock::getLockInfo (duck@obala.net, Bub #7046).\n[cjh] Fix SQL portability in Group_sql driver (Bug #7075).\n[jan] Fix PAM authentication driver, but also mark it as deprecated (Bug #6982).\n[mjr] Fix issue with native SQL Share driver that caused filtering shares by attributes to fail.\n[jan] Fix synchronization of event alarms with Funambol clients (Bug #7003).\n[jan] Correctly detect Funambol clients on Blackberry devices (Bug #6995).\n[mjr] Remove all user application permissions and group memberships from storage when removing the user from the system (Bug: 6999)\n[cjh] Call the postauthenticate hook in Auth::setAuth(), and allow the postauthenticate hook to cause setAuth() to fail. Allows postauthenticate to fire on any event, including transparent authentication, that could result in a user being successfully logged in.\n[jan] Improve attribute support and charset conversion in vCard viewer.\n[jan] Show photos in vCard object if provided with an URL.\n[mjr] Remove permissions from storage also when removing a share.\n[jan] Add Horde_Form fields for string arrays and PGP and S/MIME keys.\n[jan] Only show Add Permission icons in permissions interface where adding them is possible.\n[mjr] Fix issue in Horde_Image that was causing erratic results when cropping images.\n[jan] Fix validation of phone fields marked as required (Bug #6948).\n[mms] Fix quoting periods in display part of e-mail address (Bug #6899).\n[mms] Fix error checking when parsing an undisclosed recipients mail header and using an older version of PEAR::Mail (Bug #6930).\n[jan] Return to portal after editing or deleting blocks directly from there.\n"
3.2.5:
  notes: "[jan] SECURITY: Fix vulnerability in image form fields that allows overwriting of arbitrary local files.\n[cjh] SECURITY: Fix validation of \"number\" type preferences (Bug #8399).\n[mms] SECURITY: Don't display unknown text parts inline (Bug #8311).\n"
3.2.4:
  notes: "[cjh] SECURITY: Escape output in the tag cloud block (found by Gunnar Wrobel <p@rdus.de>).\n[cjh] SECURITY: Validate the Horde_Image driver name (found by Gunnar Wrobel <p@rdus.de>).\n"
3.2.3:
  notes: "[cjh] SECURITY: Add another check to the XSS filter.\n"
3.2.2:
  notes: "[jan] SECURITY: Fix unescaped output in the MIME attachment linking.\n[jan] SECURITY: Add another check to the XSS filter.\n"
3.2.1:
  notes: "[cjh] SECURITY: Escape item names in the object browser (Bug #6906).\n[cjh] Select db before queries in MySQL SessionHandler (Bug #6673).\n[jan] Format messages sent through MIME_Mail in flowed text format.\n[cjh] Catch errors if the Cache_file backend doesn't have permission to garbage collect (Bug #6895).\n[cjh] Fix deletion of SQL shares when using split read/write databases (duck@obala.net, Bug #6870).\n[mms] Workaround broken IE behavior when downloading files with 8-bit filenames (felix5ng@yahoo.com.hk, Bug #129).\n[cjh] Fix storing of unlocked preferences set by hooks (manuel@mausz.at, Bug #6822).\n[mms] Allow Horde memcache driver to use UNIX sockets (Bug #6848).\n[mjr] Various fixes for hierarchical SQL Share driver involving share names, better error checking and logging.\n[gwr] Added group driver for Kolab.\n[gwr] Added IMAP based preferences driver for Kolab.\n[mms] Fix missing timestamp variable in Horde SQL cache driver (keith@ajmani.org, Bug #6839).\n[cjh] Fix over-zealous preference caching when preferences are requested for a different user (Bug #6820).\n[mjr] Fix issue in Horde_Image that caused errors when performing certain image operations immediately after an image had been cropped when using the ImageMagick driver.\n[cjh] Fix order of checks in String::convertCharset (Bug #6794).\n[mms] Fix parsing of addresses in headers when the RFC 2047-encoded personal part of the address contains address list delimiters (Bug #6747).\n[cjh] Fix generation of unique keys in configuration for machines too fast for microtime() (mail@dunix-data.de, Bug #6762).\n"
3.2.0:
  notes: "Original version string was 3.2\n[jan] Fix synchronization of contacts with some SyncML clients (Bug #6706).\n[mjr] Fix SQL bitwise comparison issue in native SQL share drivers that affected PostgresSQL (Bug #6751).\n[cjh] Ensure users' email addresses are well-formed (Bug #6654).\n[jan] Remove About... link from help viewer.\n[mms] Update Xinha editor to support Safari 3.\n"
3.2.0-RC4:
  notes: "Original version string was 3.2RC4\n[bak] Improvements to WebDAV return codes and implement WebDAV locks\n[bak] Add Horde_Lock subsystem\n[mms] Add memcache caching support to all session backends.\n[cjh] Apply fix for http://dev.rubyonrails.org/ticket/11473 to prototype.js (Request #6590).\n[cjh] Add a files-based Preferences backend (thomas.jarosch@intra2net.com, Request #6653).\n[cjh] Correct line-folding of encoded lines in iCalendar data (Gunnar Wrobel <p@rdus.de>, Bug #6555).\n[cjh] Add a configuration option for whether users can share with groups they aren't members of (thomas.jarosch@intra2net.com, Request #6619).\n[cjh] Ensure that alarms are created with a NULL alarm_snooze value (michael.redinger@uibk.ac.at, Bug #6183).\n[cjh] Add an admintools script for creating PEAR::DB sequences manually.\n[cjh] Improved support for PGP fingerprints (Bug #6363).\n[jan] Add rpc/ directory for prettified RPC URLs.\n[jan] Move SyncML anchors out of the DataTree into a separate database table.\n[cjh] Add beta SQL Permissions driver (duck@obala.net, Request #6150).\n[cjh] Add beta SQL Group driver (duck@obala.net, Request #6175).\n[jan] Use wider columns for the SyncML database table to correctly store long UIDs (Bug #5025).\n[jan] Add \"hordeweb\" theme.\n[jan] Add MIME::parseAddressList().\n[jan] Add icons to edit and delete blocks directly from the portal.\n[jan] Allow users to specify login credentials for Horde applications in the preferences.\n[jan] Add NLS::setLanguageEnvironment() and NLS::setCharsetEnvironment().\n[cjh] Fix LDAP authentication (Bug #6450).\n[jan] Improve synchronization with Funambol clients.\n[mas] Fix false positive verification of S/MIME messages (Bug #6323).\n"
3.2.0-RC3:
  notes: "Original version string was 3.2RC3\n[cjh] Fix Horde_Compress_zip::checkZipData (Bug #6413).\n[jan] Allow adding attachments to the problem reporting form.\n[cjh] Make sure that when we used a cached Preferences object, we set the correct scope (Bug #6395).\n[cjh] Set LC_TIME to C for consistency in date parsing in the SSH2 backend (michael-dev@fami-braun.de, Bug #6396).\n[cjh] Add experimental native SQL Share driver (duck@obala.net, Request #6109).\n[cjh] Recognize IE8 in the Browser class (vilius@lnk.lt, Request #6390).\n[cjh] Don't treat no results as an error in the LDAP Groups driver (asmarre@ull.es, Request #6362).\n[cjh] Use conf.bak.php for backup files so they are parsed by PHP (Request #6341).\n[cjh] Add a configuration setting for using pretty URLs (Request #6264).\n[cjh] Add a method for counting attribute values without returning full objects from the DataTree (duck@obala.net, Request #6289).\n[cjh] Protect logout links with CSRF tokens.\n[jan] Fix listing of folders with whitespace in the name using the SSH2 VFS driver (Bug #6227).\n[jan] Don't indent first line of paragraphs when converting HTML to plain text.\n[cjh] Add a PHP 5 SoapServer RPC backend.\n[cjh] Add a method for getting just attributes, instead of full object and tree structure, from the DataTree (duck@obala.net, Request #6209).\n[cjh] Add a mock Groups driver for sites that don't need Group support (duck@obala.net, Request #6157).\n[jan] Highlight links in HTML viewer that triggered a phishing warning.\n[jan] Fix some string parsing on systems that don't have the \"en\" or \"en_US\" locales installed (Bug #6194).\n[jan] Avoid JavaScript popup if a translation for the WYSIWYG editor doesn't exist (Bug #6174).\n[cjh] Fix autocreation of DataTree parents (almarin@um.es, Bug #6167).\n[jan] Fix linefolding with multibyte strings in iCalendar library (Bug #6103).\n[jan] Add multibyte-safe String::wordwrap() method.\n"
3.2.0-RC2:
  notes: "Original version string was 3.2RC2\n[jan] SECURITY: Fix privilege escalation in Horde API.\n[jan] SECURITY: Filter out FRAME tags from HTML messages (CVE-2007-6018).\n[jan] SECURITY: The XSS filter passes the complete XSS cheat sheet (http://ha.ckers.org/xss.html) now.\n[cjh] Don't trust HTTP_X_FORWARDED_FOR or any proxied requests when consulting the safe_ips list (Bug #6133).\n[cjh] Add a PHP 5-only block for putting syndicated feeds on the Horde Portal (duck@obala.net, Request #6107).\n[cjh] Automate detection of which themes/app combinations have custom icons (Bug #6105).\n[cjh] Fix listing of current session ids in the memcache SessionHandler (Bug #6083).\n[cjh] Correct handling of cache misses from the Horde_Cache_sql driver (Bug #6060).\n[mas] Add support for PGP revocation certificates to Crypt library.\n[cjh] Provide specific validation errors when datetime Horde_Form fields have a date but not a time, or vice-versa (Bug #5992).\n[cjh] Read email addresses from subjectAltName property of S/MIME certs (Bug #5986).\n[cjh] Catch Horde_Block errors when doing ajax updates.\n[cjh] Allow Horde_Mobile_select to take already-encoded options (Bug #5849).\n[jwm] Add support in Horde_RPC_soap for handling SOAP endpoints that only expose certain types and/or methods.\n[jwm] Make the SOAP service name in Horde_RPC_soap configurable.\n[jwm] Add basic logging of SOAP calls (method name and args, elapsed time, bytes sent in response).\n[cjh] Support LDAP password expiration when using Sun/Fedora Directory Server (marco@csita.unige.it, Request #6012).\n[cjh] Remove the wrap attribute from preference textarea tags (Bug #6024).\n[cjh] Recommend and default to SSHA hashed passwords.\n[jan] Fix rendering of messages in some charsets that are only supported by iconv (Bug #5962).\n[jan] Display WYSIWYG editor with correct language.\n[jan] Fix creating of sub groups (Bug #5970).\n[jan] Fix linking of URLs encapsulated in angle brackets (Bug #4946).\n[jan] Fix edge cases of CSV file imports (Bugs #3839, #4025).\n[mms] For SessionHandler drivers, don't write to backend if the session data did not change while loading the current page.\n[cjh] The Auth:: package no longer depends on the PHP mhash extension for some encryption types.\n[cjh] Add stream support to some VFS backends (Request #5913).\n[jan] Add client code to JSON-RPC class and implement JSON-RPC 1.1.\n"
3.2.0-RC1:
  notes: "Original version string was 3.2RC1\n[jan] Apply user name hooks when editing share permissions (steinkel@ctinetworks.com, Bug #5844).\n[jan] Fix some date handling with dates outside the unix epoch (Bug #5893).\n[jan] Fix fixed portal blocks (Bug #5853).\n[jan] Fix Share caching (Bug #5748).\n[cjh] Fix deleting categories (Gunnar Wrobel <p@rdus.de>, Bug #5873).\n[cjh] Import dhtmlHistory.js from DIMP into Horde core.\n[cjh] UTF-8-encode DNs in the LDAP Groups driver (patrick.abiven@apitech.fr, Bugs #4692 and #4918).\n[mjr] Addition of an Effects API to the Horde_Image package, including a number of image effect plugins.\n[jan] Add country list form field.\n[cjh] Add example logrotate configuration (Martin Fraer <mdf@darksnow.net>).\n[cjh] Add LDAP ACL definition for preferences (Martin Fraer <mdf@darksnow.net>).\n[cjh] Add an index on horde_datatree_attribute.attribute_value to improve DataTree performance (Andrew Morgan <morgan@orst.edu>).\n[jan] Add SQL upgrade scripts.\n[jan] Fix escaping of parenthesis in PDF documents (PEAR Bug #12092).\n[jan] Fix alarm notification script (Bug #5660).\n[jan] Fix PDF generation with some locales (Gunnar Wrobel, Bug #4094).\n[jan] Move all application-specific hook examples to the applications' config/ directories.\n[jan] Fix SMTP configuration being set to \"Best available authentication\" (Bug #5679).\n[jan] Add bind parameters to LDAP account portal block configuration (Request #5705).\n[cjh] Fix login screen enter key behavior in some circumstances (Bug #5696).\n[mjr] Add a new block for displaying a tag cloud that works across all Horde applications implementing a searchTag api.\n[cjh] Use the Silk flag icons from http://famfamfam.com/lab/icons/flags/ for all flag sets (Bug #5681).\n[cjh] Fix generation of UIDs with PHP 5.2+.\n[cjh] Add a JSON-RPC Horde_RPC backend (joey@joeyhewitt.com).\n[cjh] Allow selecting any available sound when creating alarms as an administrator (Request #5619).\n[cjh] Fix updating of last_maintenance preference with PHP 4 (Bug #5111).\n[cjh] Allow considering all IPs to be \"safe\" for encryption operations, passphrase entry, etc., when using SSL hardware or other secure environments (adrieder@sbox.tugraz.at, Request #5568).\n[cjh] Fix CSRF protection with Horde_Form objects submitted with preserve().\n"
3.2.0-ALPHA1:
  notes: "Original version string was 3.2.0-ALPHA\nOriginal version string was 3.2ALPHA\n[cjh] Centralize sounds for audio alarms in Horde.\n[cjh] Include CSRF protection when using Horde_Form Tokens (Request #4492).\n[cjh] Add first_week_day preference and use it in the calendar widget (Bug #1729).\n[cjh] Cache permissions with Horde_Cache (duck@obala.net).\n[jan] Add configuration option for safe IP subnets.\n[cjh] Allow turning off a user's ability to edit share permissions (Request #4054).\n[cjh] Consolidate color pickers used for Labels and in Horde_Form (Bug #5112).\n[cjh] Log sending of problem report emails (Otto.Stolz@uni-konstanz.de, Request #5461).\n[cjh] Improve support for dates before 1970 and after 2038 (Bug #3741).\n[mms] Add option to send MIME messages in a format that may allow broken MUAs to handle 8-bit filename data.\n[cjh] Add Tango Blue (xconspirisist <contact@xconspirisist.co.uk>, roti@al.pmmf.hu, Request #2795) and Silver Surfer (Daniel Dembach <daniel.dembach@googlemail.com>) themes.\n[mms] Created a Horde-wide object to access a singlet memcache configuration.\n[cjh] Test for PCRE UTF-8 support with extension tests (thomas.jarosch@intra2net.com, Bug #1052).\n[jan] Add category field to Horde_Form.\n[cjh] Better detection of Konqueror JavaScript features (thomas.jarosch@intra2net.com, Request #5372).\n[cjh] Support the allow_multi parameter when displaying email address form types (thomas.jarosch@intra2net.com, Request #5356).\n[cjh] Add Scriptaculous and RedBox to Horde.\n[mms] Added sql driver for Horde_Cache::.\n[mms] Prevent tooltips from scrolling off screen (michael.sheldon@credativ.de, Request #3958).\n[jan] Add portal block to verify EU VAT identification numbers.\n[mms] Preserve URL anchor information when performing login.\n[jan] Add method to fetch public key by email address from key server.\n[jan] Add parameter for a temporary directory to the VC svn driver (meyer@mesw.de, Request #5051).\n[jan] Change VC library to support open_basedir restrictions (meyer@mesw.de, Request #5051).\n[cjh] Added a query for checking existance of a user to the custom SQL Auth driver (Request #5151).\n[jan] Add button to the setup screen to check for newer versions.\n[mas] Add MIME Viewer for WordPerfect documents.\n[mms] Use lzf compression to compress Horde_SessionObjects:: data in the session.\n[cjh] Replace google popup javascript searching with Google Ajax Search.\n[jan] Add datetime variable type to Horde_Form.\n[jan] Add Horde_Alarm library for reminders, alarms and notifications across all applications with pluggable notification methods.\n[jan] Add context renderer to Text_Diff package.\n[jan] Add MIME_Mail class to simplify creation and sending of MIME messages.\n[cjh] Horde_Share now has a driver system with DataTree and Kolab backends (Gunnar Wrobel <wrobel@pardus.de>, Request #4263).\n[cjh] Remove RPC_rest backend.\n[cjh] Add DELETE support to the webdav RPC implementation (Håvard Wigtil <havardw@pvv.org>, Request #4721).\n[cjh] Add a Horde-wide HTTP proxy config setting (Request #1039).\n[mms] Use the geoip PECL extension if available.\n[cjh] Add preferences change hooks that are called when preferences are set to new values (Request #4343).\n[cjh] Add Active Directory support to the LDAP account information driver (air2@dds.nl, Request #3512).\n[cjh] Add a finger driver to the account information block (difosfor@hotmail.com, Request #3546).\n[cjh] Rewrite the Prefs code to keep the same Prefs object through multiple scope changes, instead of re-loading the Horde prefs, or prefs for a scope that had already been loaded. Fixes bugs when making changes to preferences and then switching scopes again (Bug #2838).\n[cjh] Switch from hook functions for every group to a single hook function for all groups, allowing more dynamic Group_hooks implementations (dorm@dorm.org, Request #4324).\n[jan] Allow Kolab users to login with both, UID or mail address (wrobel@gentoo.org, Bug #1317).\n[cjh] Switch between 'icon' and 'iconopen' images when toggling Horde_Tree sections (Bug #2576).\n[cjh] Add a Horde_Form_Action for setting the cursor position in any text field (Request #4431).\n[cjh] Provide a link for dialing phone numbers if the \"telephony/dial\" API method is present (thomas@gelf.net, Request #3241).\n[jan] Add support for PUT method to WebDAV server (d.bussink@student.utwente.nl, Request #3032).\n[jan] Add PHP 5 support for Kolab (wrobel@gentoo.org, Bug #4062).\n[jan] Rewrite PAM authentication driver to use PAM extension from PECL.\n[mas] Implement IMAP_ACL_rfc2086::canEdit() for cases when the user is asking about their own rights.\n[mms] Correctly encode MIME parameter values via RFC 2231.\n[mms] Add method to do RFC 2231 encoding.\n[jan] Allow to set link target for \"link\" preference types.\n[cjh] Move developer and administrator tools into seperate PEAR packages that will be available from pear.horde.org.\n[mas] Conform to WCAG 1.0 Priority 2/Section 508 accessibility guidelines. (Request #4080)\n[jan] Add SMIL MIME viewer.\n[jan] Add support for virtual host based configuration.\n[jan] Add File_PDF::setTextColor() (PEAR Request #1767).\n[jan] Add File_PDF::setFontStyle() (d.baechtold@unico.ch, PEAR Request #5230).\n[jan] Add encoding parameter to XML_SVG_Document (PEAR Request #7461).\n[jan] Add SMPP driver to Net_SMS package (Ian Eure <ieure@php.net>, PEAR Request #5101).\n[jan] Add support for symmetric PGP encryption to Crypt library.\n[jan] Add option to limit file sizes in file and image form fields (Request #2155, vilius@lnk.lt).\n[jan] Add caching for shares.\n[cjh] Add an audio MIME_Viewer so that audio files are clickable and handled immediately by the browser.\n[cjh] Add Horde_Form_Type_phone as a parent for Horde_Form_Type_cellphone.\n[jan] Add caching for groups.\n[cjh] Allow dropping application (or other custom-purpose) configuration files into config/registry.d/.\n[cjh] Help now has a tree view of topics and is searchable (Request #2452).\n[cjh] translation.php now works with PHP 5 (Bug #3539).\n[jan] Highlight new configuration items in the configuration interface (Request #3868).\n[cjh] Add Shibboleth transparent authentication driver (Cassio Nishiguchi <cassio@protectnetwork.org>).\n[cjh] Add native email address validation to Horde_Form_Type_email based on http://iamcal.com/publish/articles/php/parsing_email.\n[jan] Add multidomain support for Kolab servers (tokoe@kde.org, Request #3579).\n[cjh] Deprecate htmlarea in favor of xinha.\n[mms] Add VFS SSH2/SFTP driver (Cliff Green <green@umdnj.edu>).\n[mjr] Move the Horde_Config_Node and related classes out of Horde_Config and into it's own Horde_DOM package.\n[mjr] Add support for Horde_Share to the Net_IMSP package.\n[jan] Add connection pooling support with memcache extension 2.0.0 (adrieder@sbox.tugraz.at, Request #3213).\n[jan] Add memcached driver to the Horde_Cache package (Duck <duck@obala.net>).\n[cjh] Add phpGroupWare/eGroupWare compatibility driver to Horde_RPC that allows mapping xml-rpc methods into Horde applications (Request #2886).\n[cjh] Add _horde_hook_post_pushapp for doing actions directly after $registry->pushApp() succeeds.\n[jan] Update portal block content in the background instead of reloading the whole portal periodically.\n[mdj] Add support for split read/write databases.\n[mdj] Add failover support for database backends.\n[jan] Add configuration option to require users to confirm email addresses added to their identities.\n[cjh] Add a SpellChecker package.\n[cjh] Have Horde::addScriptFile() check for a non-PHP version of scripts to avoid javascript.php whenever possible.\n[cjh] Add SERIALIZE_JSON mode with code from PEAR's Services_JSON.\n"
3.1.9:
  notes: "[jan] SECURITY: Add another check to the XSS filter.\n"
3.1.8:
  notes: "[cjh] SECURITY: Escape item names in the object browser (Bug #6906).\n[jan] Fix large messages being rendered empty with PHP 5.2 (Bug #5792).\n"
3.1.7:
  notes: "[cjh] SECURITY: Fix arbitrary file inclusion through abuse of the theme preference (CVE-2008-1284).\n"
3.1.6:
  notes: "[jan] SECURITY: Fix privilege escalation in Horde API.\n[jan] SECURITY: Filter out FRAME tags from HTML messages (CVE-2007-6018).\n[jan] SECURITY: The XSS filter passes the complete XSS cheat sheet (http://ha.ckers.org/xss.html) now.\n[jan] Apply user name hooks when editing share permissions (steinkel@ctinetworks.com, Bug #5844).\n[jan] Fix fixed portal blocks (Bug #5853).\n"
3.1.5:
  notes: "[cjh] Fix identity javascript when some fields are disabled (veikko@immonen@otaverkko.fi, Bug #5595).\n[cjh] Disable the Turkish locale if using PHP 5 (see http://bugs.php.net/bug.php?id=35050).\n[jan] Fix selecting the language on the login screen (Bug #5098).\n[jan] Fix searching for single quotes in email headers (qa@cpanel.net, Bug #4854).\n[jan] Fix portal layouts with more than one horizontally expanded block per row.\n"
3.1.4:
  notes: "[jan] SECURITY: Correctly quote file names in cleanup script for temporary files.\n[jan] Fix RPC authentication on CGI SAPIs.\n[jan] Detect unencrypted PGP messages.\n[jan] Correctly quote file names in cleanup script for temporary files.\n"
3.1.4-RC1:
  notes: "Original version string was 3.1.4RC1\n[jan] SECURITY: Fix an XSS vulnerability in the language selection.\n[jan] Complete Cyrus virtual domain support in cyrsql driver (Vilius Sumskas <vilius@lnk.lt>, Request #4967).\n[jan] Add option whether to strip domains from usernames in the account block (Request #4955).\n[jan] Fix email lists not being validated under certain conditions (Bug #4834).\n[cjh] Add a REST-ful preferences interface.\n[cjh] Faster DataTree-to-SQL History migration script (josh@endries.org, Request #4732).\n[cjh] Improved automatic webroot detection (Ben Klang, Request #4126).\n[cjh] Rewrite and fix the OCI8 SessionHandler (Bug #3452).\n[cjh] Allow signup hooks to override the user_name and password fields (thomas@gelf.net, Request #2904).\n[cjh] Fix creation of mailbox quotas by the Auth_cyrus driver (pascal@vmfacility.fr, Bug #4678).\n[cjh] Add \"Save and Finish\" to the share edit window (webmgr@muskingum.edu, Request #4307).\n[cjh] Let mailto: and anchor (#) links through Horde::externalUrl (Bug #3079).\n[cjh] Add smbclient version of the SMB Auth class (larry@wimble.biz, Request #4338).\n[cjh] Remove problematic \"data descriptor\" segment from generated ZIP files (reitsma@denison.edu, Bug #4670).\n[cjh] Strip accesskeys from menu tooltips when only showing icons (Bug #4667).\n[jan] Fix saving files in the root directory of an SQL VFS backend (Bug #4652, Ben Klang <ben@alkaloid.net>).\n[jan] Fix displaying all maintenance tasks to be confirmed at once (Bug #4377).\n[cjh] Fix return format of DataTree_null::getByAttributes() (thomas.jarosch@intra2net.com, Bug #4651).\n[jan] Support departments in vCard's ORG properties (martin@matuska.org, Request #4285).\n[cjh] Rename Auth_sasl backend to Auth_peclsasl to avoid conflicts with PEAR's Auth_SASL (Bug #4547).\n[cjh] Implement handling of vTimezones in iCalendar data (Carl Thompson <lists-horde@carlthompson.net>, Bug #4399).\n[cjh] keybindings.js now works with Safari/KHTML.\n[jan] Avoid recursive folder creation when sharing Kolab folders (michael.sheldon@credativ.de, Bug #4325).\n[jan] Add Kolab specific account block driver to support special Kolab users (mzizka@hotmail.com, Request: #4119).\n[mms] Only dim below the last signature line of input text in the dimsignature Text_Filter driver.\n"
3.1.3:
  notes: "[cjh] SECURITY: Validate GET-based URL parameters provided to Horde's index.php.\n[jan] Support importing of combined date/time fields (Bug #3116).\n[jan] Log a warning if using settings that break sessions.\n[jan] Fix parse error that broke SyncML synchronization (Bug #4168).\n[jan] Support Kolab group ACLs (csacca@thecsl.org, Request #2270).\n[jan] Fix unserialize() errors in session viewer (Bug #3586).\n"
3.1.2:
  notes: "[cjh] SECURITY: Remove unused image proxy code from dereferrer.\n[cjh] SECURITY: Close XSS problems in dereferrer (IE only), help viewer and problem reporting screen.\n[cjh] Handle errors generated during XML-RPC calls properly (Ben Klang <ben@alkaloid.net>, Bug #4097).\n[jan] Add additional indexes to preference table (j.benoit@free.fr, Bug #4079).\n[jan] Fix preference cache (Bug #4079).\n[jan] Add configuration option to disable GET-based sessions.\n[jan] Fix preferences access for special Kolab users (wrobel@gentoo.org, Bug #4049).\n[mms] Fix setting default charset for non-MIME messages (Bug #3804).\n[jan] Add several methods to manipulate groups and shares to Horde's API.\n[jan] Return serialized PHP values through the REST interface if passing a restContentType parameter of 'application/x-httpd-php'.\n[cjh] Only allow users to assign Share permissions for groups they are members of.\n[jan] Allow to disable VFS backends in the applications' configurations.\n[mms] Update the MIME Content-Type charset parameter in a MIME message when we convert the contents for viewing in the browser (Bug #3729).\n[cjh] Fix Horde_Form_Type_assign javascript (Bug #3740).\n[jan] Add upgrade scripts for Oracle.\n[cjh] Include PATH_INFO whenever QUERY_STRING is requested in Horde::selfUrl() (Bug #3703).\n[jan] Add generic SQL upgrade script (Daniel A. Ramaley <daniel.ramaley@drake.edu>).\n"
3.1.1:
  notes: "[cjh] SECURITY: Fix remote code execution vulnerability found by Jan Schneider.\n[cjh] Fix export and synchronization of events across daylight saving time changes.\n[jan] Add proper locking to mysql session handler (Bug #3660).\n[cjh] ie.css is not necessary for IE7, so rename appropriately (Bug #3671).\n[jan] Fix quota support for some VFS drivers (Bug #3647).\n[cjh] Better Opera Mini detection (Bug #2961).\n[jan] Fix menu wrapping with Kolab and Purple theme (Bug #3594).\n"
3.1.0:
  notes: "Original version string was 3.1\n[cjh] Remove bogus Content-Location header in the WML Mobile renderer (Bug #3476).\n[jan] Add option to block Kolab authentication after failed logins (tokoe@kde.org, Request #3474).\n[jan] Allow to set height of iframe portal block (tevans@tachometry.com, Request #3504).\n[cjh] Update ToolTips JavaScript object to allow tooltips on non-<a> elements.\n[mms] Sort an IMAP_Tree object by display name, not full mailbox name.\n[mas] Make sure database portability options are applied in History module. (Bug #3482)\n"
3.1.0-RC3:
  notes: "Original version string was 3.1RC3\n[jan] Make sure that Kolab users always have the same user name (Bug #1317).\n[jan] Fix moving objects with Kolab drivers (tokoe@kde.org, Bug #2811).\n[jan] Add reset button to image form fields.\n[jan] Fix selection of default identity (Bug #3416).\n[mas] Add Hebrew translation.\n[mas] Add support for RFC 4314-style IMAP ACLs.\n[mms] Correctly encode 7-bit MIME messages with NULL characters (Bug #3395).\n[jan] Hide applications with status 'notoolbar' from options menu (Bug #3383).\n"
3.1.0-RC2:
  notes: "Original version string was 3.1RC2\n[jan] Add Khmer translation (Leang Chumsoben <soben@khmeros.info>).\n[mms] Handle quoted text when parsing MDN requests (Bug #3340).\n[ben] Better support for MS-SQL.\n[jan] Show correct address in last-login message if connecting through a proxy (Bug #3288).\n[mms] Allow admin to disable browser string checks (Bug #3282).\n[jan] Correctly encode email group names (Bug #3234).\n[cjh] Add a display method for hourminutesecond form fields (Bug #3165).\n[cjh] Horde's preferences now are referred to as Global Options so the user doesn't need to know what Horde is, and always appear at the top of lists of apps for which preferences are available.\n[jan] Add upgrade instructions (Kevin Myer kevin_myer@iu13.org, Bug #3222).\n[cjh] Applications which do not have a config/prefs.php file no longer appear in lists of applications to set options for to avoid confusion.\n"
3.1.0-RC1:
  notes: "Original version string was 3.1RC1\n[cjh] Make the lock directory for the memcached SessionHandler configurable (Bug #3120).\n[mms] Update Text_Flowed:: to support RFC 3676.\n[cjh] Fix output escaping of Horde_Form_Type_cellphone in UI_VarRenderer_html.\n[cjh] Allow choosing [None] as a database for $conf['sql'] (Bug #2754).\n[jan] Add Icelandic translation (Bjorn Davidsson <bjossi@snerpa.is>).\n[mms] Work around broken imap_8bit() implementation in MIME::quotedPrintableEncode (Bug #2975).\n[mms] Add garbage collection to Horde_Cache.\n[cjh] Fix Group::listAllUsers (Carlos Pedrinaci, Bug #2937).\n[jan] Add high contrast theme (tmerritt@email.arizona.edu, Request #1598).\n[jan] Keeps sidebar expansion state across sessions (Request #1564).\n[jan] Add configuration for mail domain used for problem reports (dustin@ywlcs.org, Request #1376).\n[cjh] Add dynamic table re-sorting through javascript.\n[cjh] Inspect method signatures so that the REST driver isn't dependent on the order of GET parameters.\n[cjh] Add horde/getPreference and horde/setPreference API methods.\n[cjh] Add a list of active users and active sessions to the admin area.\n[cjh] Add unobtrusive javascript tooltips based on the title attribute.\n[jan] Move sidebar collapse/expand button below the menu bar (Oliver Kuhl <okuhl@netcologne.de>).\n[jan] Add Ideas theme (Roel Gloudemans <roel@gloudemans.info>).\n[cjh] Move Horde_History data to its own SQL table (Bug #2298).\n[jan] Add Horde_Form_type_figlet for CAPTCHA fields with figlet fonts.\n[jan] Add Horde_Form_Type_dblookup for form fields with database lookups (Request #322).\n[jan] Add configuration to disable \"About\" links in help windows (\"Matthew M. Gamble\" <horde-dev@mgamble.ca>).\n[cjh] Allow sending problem reports to a ticket system using the tickets/addTicket API call (Bug #1917).\n[cjh] Define RTL styles via an additional stylesheet.\n[cjh] Usability improvements to the identities management page (Bug #1846).\n[ben] Add LDAP support to Group package.\n[cjh] Add SMB driver to VFS package.\n[cjh] Allow creation of expiring accounts in LDAP (Roel Gloudemans <roel@gloudemans.info>).\n[cjh] Add configuration option to search for the user's DN in the Prefs_ldap driver (Bug #1786).\n[jan] Allow to specify the objectclass for new users added through LDAP (Roel Gloudemans <roel@gloudemans.info>).\n[jan] Add password expiration and password encryption to LDAP authentication driver (Roel Gloudemans <roel@gloudemans.info>).\n[jan] Add permissions to restrict number of portal blocks.\n[jan] Add configuration for fixed portal blocks.\n[jmf] Add audio notification listener, make portal handle audio notifications by blocks (e.g. the IMP folder summary).\n[mms] Cache certain registry data to prevent unneeded file loading/parsing after the initial login.\n[mas] Add support for counting authenticated sessions via SessionHandlers.\n[cjh] Re-work Tabs so that background images can be used in creative ways.\n[jan] Add \"My Account Information\" block that mimics the Accounts module.\n[jan] Improve rendering for right-to-left languages (Amirkabir MetaNET Ltd.).\n[jan] Add support for arbitrary, non-boolean permission values.\n[ben] Add alternate_login and redirect_on_logout features.\n[jan] Add generic SMTP driver to Net_SMS package (Ian Eure <ieure@php.net>).\n[mjr] Net_IMSP will now automatically create user's default addressbook if it does not already exist instead of just complaining about it.\n[cjh] Add select all, none, and invert optionally to Horde_Form_Type_set fields (Duck <duck@obala.net>).\n[cjh] Preferences overview is now built with a definition list (<dl>) styled with CSS.\n[jan] Add sort() method to Horde_Tree class.\n[mdj] Change any output of <b> and <i> tags to <strong> and <em> for better accessibility support.\n[jmf] Allow Horde templates to include application blocks.\n[jan] Add extended forecasts to weatherdotcom Block (Rick Emery <rick@emery.homelinux.net>).\n[cjh] Allow for arbitrary attribute filters when listing or counting Share objects (Duck <duck@obala.net>).\n[cjh] Add DataTree::getSortedTree() (Duck <duck@obala.net>).\n[mjr] Support for imtest authentication added to Prefs_imsp.\n[cjh] Add REST RPC driver (srrafa@usc.es, Bug #1500).\n[cjh] Add support for fetching the highest and lowest ids in any DataTree group (Duck <duck@obala.net>).\n[cjh] Add DataTree::sortByAttributes() for sorting DataTreeObjects based on their attributes (Duck <duck@obala.net>).\n[mjr] Initial support added to Net_IMSP for imtest driver (provides persistent IMSP connections using Cyrus imtest utility).\n[jan] Add map links to UK and Australian address fields (turba.list@suborbit.com, Bug #1461).\n[mms] Detection of \"phishing\" tactics in the HTML MIME_Viewer (Todd Merritt <tmerritt@email.arizona.edu>, Bug #1434).\n[mms] Text_Flowed package now correctly handles multibyte characters.\n[mms] Maintenance confirmation pages now rendered via Horde_Template (Vilius Sumskas <vilius@lnk.lt>).\n[jan] Allow to specify charset of imported CSV files.\n[jan] Add File_CSV package.\n[jan] Show application names in permissions administration.\n[jmf] Allow the auth backend to request a password change, support expiring password in the SQL backend.\n[cjh] Show menu children for every application with preferences under Options in the sidebar menu (Bug #1058).\n[mms] Allow individual MIME_Viewers to override the Content-Disposition MIME parameter and force viewing inline.\n"
3.0.12:
  notes: "[cjh] SECURITY: Validate GET-based URL parameters provided to Horde's index.php.\n"
3.0.11:
  notes: "[cjh] SECURITY: Remove unused image proxy code from dereferrer.\n[cjh] SECURITY: Close XSS problems in dereferrer (IE only), help viewer and problem reporting screen.\n"
3.0.10:
  notes: "[cjh] SECURITY: Fix remote code execution vulnerability found by Jan Schneider.\n"
3.0.9:
  notes: "[cjh] Fix showstopper bug in Horde_Form select fields (Bug #3123).\n"
3.0.8:
  notes: "[cjh] When deleting an identity, don't show the deleted identity in the default identity select dropdown on the next page load.\n[cjh] Fix escaping of data in the preferences templates.\n[cjh] Fix escaping of data in the data import templates.\n[cjh] Fix output escaping of Horde_Form_Type_cellphone in UI_VarRenderer_html.\n[cjh] SECURITY: Close several XSS problems in the share edit window.\n[jan] Fix weather.com portal block.\n"
3.0.7:
  notes: "[jan] SECURITY: Fix XSS vulnerabilities in gzip/tar and css MIME viewers.\n[cjh] Add missing COMMIT in MySQL SessionHandler driver (dgehl@inverse.ca, Bug #2731).\n"
3.0.6:
  notes: "[jan] Pass all URL parameters where linking email addresses (Request #1530).\n[jan] Show Word viewer content with correct charset (sgrondin@csbf.qc.ca, Bug #2737).\n"
3.0.6-RC1:
  notes: "Original version string was 3.0.6RC1\n[cjh] Fix transactions and binary data in PostgreSQL session handler (cbs@cts.ucla.edu, Bug #2749, #2789).\n[jan] Fix sidebar menu layout for Opera (Bug #2722).\n[cjh] Add <pre> to supported help tags (vijay.mahrra@es.easynet.net, Bug #2633).\n[cjh] Fix validation on ipaddress Horde_Form fields (Bug #2583).\n[cjh] Add Auth::getAuthDomain() (Bug #2573).\n[mjr] Add ability to enable/disable IMSP globally via configuration settings.\n[jan] Fix calendar popup with Safari browsers (t.zell@gmx.de, Bug #2448).\n[cjh] When using CGI PHP, SCRIPT_NAME may contain the path to the PHP binary instead of the script being run; use PHP_SELF instead (Bug #2401).\n[jan] Fix sharing with groups if using group hooks (Bug #2292).\n"
3.0.5:
  notes: "[mms] Fix VFS's autocreatePath() for directory paths containing the root directory.\n[jan] Fix cyrsql authentication driver with unixhierarchysep enabled (sgrondin@csbf.qc.ca, Bug #2367).\n[mms] Fix nested IMAP AND searches.\n[mms] In sql VFS driver, allow the use of '/' at the beginning of a path to indicate the base directory.\n[jan] Fix returning to last page after sending problem report (Bug #2350).\n[mms] Fix a bug that caused hook code to be run unnecessarily after a user is already logged in.\n"
3.0.5-RC2:
  notes: "Original version string was 3.0.5RC2\n[cjh] Fix a far-reaching DataTree bug in loading parent ids (Bug #2203).\n"
3.0.5-RC1:
  notes: "Original version string was 3.0.5RC1\n[jan] Add Bosnian translation (Vedran Ljubovic <vljubovic@smartnet.ba>).\n[cjh] Let Horde_Tree handle all indent calculation based on parent/child relationships (Bug #2198).\n[cjh] Add initial LDAP SessionHandler driver.\n[cjh] Use row-level locking or transactions where possible to avoid session corruption in SessionHandler (Bug #1580).\n[mms] Add the memcached SessionHandler:: driver (Rong-En Fan <rafan@csie.org>).\n[mms] Fix verification of MIME strings with escaped quotes (Bug #2168).\n[jan] Fix generation of free periods in free/busy code with overlapping events.\n[jan] Don't show Options button in problem reporting page.\n[jan] Add Util::realPath() method.\n[mas] Include version numbers for applications on Admin Setup screen. (Bug #1420)\n[mas] Change IMAP Auth driver to use imap/notls by default in non-DSN mode to match DSN mode.\n[mas] Add tls and self-signed certificate configuration options to IMAP Auth driver. (Bug #1357)\n[cjh] Recognize Opera 8+ as providing advanced features (Bug #2066).\n[cjh] Fix reading of binary files on Windows in VC_svn (Bug #2036).\n[mas] Fix SQL 'LIKE' case-insensitive comparison. (Bug #2030)\n[jan] Allow charset aware IMAP searches.\n[jan] Fix Google search block for non-ascii characters (Bug #1329).\n[jan] Add quick-install instructions.\n[jan] Improve performance of several framework packages.\n[mms] Fix MIME_Contents:: caching in PHP 5 (Bug #1410).\n[jan] Fix VC SVN backend to support user names with spaces (shimmanning@gmail.com, Bug #1919).\n[cjh] Escape HTML in identity names (Bug #1910).\n[mas] Use updated PostgreSQL function names.\n[ben] Update application list in horde's LDAP schema\n[cjh] Enforce maxlength restrictions in Horde_Form validation (Bug #1895).\n[jan] Disable weather.com Block if not configured.\n[cjh] Include sourceroot in VC cache keys (Bug #1783).\n[jan] Add SQL script and instructions for MSDE databases (Bugs #1862, #1870, jeff@image-src.com).\n[jan] Allow portal blocks to be larger than two column/rows (Bugs #1189, 1632).\n[jan] Add SMTP authentication to problem reporting (Bug #1128).\n[jan] Support help files in admin directory with translations.php (Bug #1344).\n[jan] Fixed SQL binding for ODBC and MSSQL drivers (Bug #1816).\n[jan] Add configuration option to set location of MIME magic database.\n[mms] Make sure headers in a MIME_Part are encoded with the same character set used in that MIME_Part (Bug #1591).\n[mms] Add List-Headers listed in RFC 2369 to the list of MIME Headers that can only appear once in a single header (Bug #1766).\n[cjh] Fix typo in parsing of FREEBUSY data (Bug #1590).\n[jan] Support SQLite and Oracle in all SQL backend configurations.\n[cjh] Use bind variables in the Auth, VFS, and SessionHandler SQL drivers, and in scripts/remove_prefs.php (selsky@columbia.edu, Bugs #1665, #1666, #1667, #1668, #1677).\n[cjh] session_set_cookie_params() expects a relative timeout; setcookie wants absolute. Go back to a configinteger for $conf['session']['timeout'] and add time() to that value in setcookie() calls (Bugs #1302, #1658). THIS MAY BREAK CONFIGURATIONS SET TO USE PHP CODE. MAKE SURE TO UPDATE YOUR $conf['session']['timeout'] SETTING AFTER UPGRADING.\n[cjh] Use bind variables in the Prefs and Token SQL drivers (selsky@columbia.edu, Bugs #1652, #1653).\n[mms] Prune expanded folders that no longer exist in IMAP_Tree (Bug #1517).\n[cjh] Don't try to compress output if ZPS compression is on (Bug #1626).\n[cjh] If an app only has one prefGroup, always show that prefGroup instead of showing an overview screen with only one entry.\n"
3.0.4:
  notes: "[cjh] Use fully qualified URLs in the AnselImage HTMLArea plugin (Bug #1259).\n[cjh] SECURITY: Close XSS when setting the parent frame's page title by javascript.\n[blc] Add PostgreSQL upgrade script (Brad Witte <brad@distanthaze.com)\n[cjh] Avoid division by zero if all preferences are locked (Bug #1627).\n[jan] Fix sidebar refreshing with Opera.\n"
3.0.4-RC2:
  notes: "Original version string was 3.0.4RC2\n[jan] Improve \"login\" authentication driver (Bug #1571).\n[jan] Show database specific connection parameters in global SQL configuration too.\n[jan] Fix left menu overflow in IE and Safari (Bug #1526).\n[jan] Fix autocreating of directories and updating of existing files in the sql_file VFS driver (eddie@omegaware.com, Bugs #1552 and #1553).\n[jan] Make wrapping menus visible with Gecko 1.4 browsers (e.g. Netscape 7.1).\n[jan] Use SQL binding for some DataTree operations.\n[jan] Fix DataTree SQL support for Oracle.\n[jan] Fix SQL configuration for Oracle.\n[mms] Make sure VFS garbage collection is done recursively.\n"
3.0.4-RC1:
  notes: "Original version string was 3.0.4RC1\n[jan] Add Horde_Tree_select class (Ben Chavet <ben@horde.org>).\n[mjr] Fix Net_IMSP to properly handle multiple lines in addressbook fields.\n[jan] Fix MIME decoding of strings that contain \"%\" in multibyte sequences (Bug #1423).\n[cjh] Control space under the menu bar with a themeable style (Bug #1421).\n[cjh] Fix Horde_Tree with the multiline option so that row styles extend over the whole height of the row.\n[cjh] If configuration files that have a .dist version are missing, Horde_Test::configFilesMissing() will copy the defaults over if Horde can write to the filesystem (Bug #1015).\n[cjh] Fix AnselImage HTMLArea plugin (Bug #1470).\n[cjh] Just retrieve uid when listing users in the LDAP Authentication driver.\n[cjh] Add choraPrefs to the hordePerson LDAP schema (Bug #1452).\n[cjh] 'rootdn' is not required for LDAP preferences (Bug #1453).\n[mms] Fix IMAP thread creation when the base level contains more than one message.\n[jan] Allow vCards with lowercase field descriptors.\n[jan] Improve tar/gzip MIME viewer to better show unzipped content.\n[mjr] Better error handling in Net_IMSP.\n[mms] Speed improvements and sorting fixes for IMAP_Tree.\n[mms] IMAP_Tree now handles non-uppercased 'INBOX' strings returned from the mail server (Bug #199).\n[mms] Rebuild certain internal MIME_Part data when retrieving from a cache.\n[jan] Show database specific connection parameters in configuration screen.\n[mms] IMAP_Tree now correctly updated when subscribing/unsubscribing from a mailbox (Bug #1111).\n[mms] Make IMAP searches of non-\"standard\" headers work with the NOT directive (Bug #1368).\n[jan] Fixed double line numbers in Source-highlight MIME viewer (Bug #1383).\n[mms] Fix IMAP_Thread when dealing with the first message in the mailbox (Bug #1257).\n[cjh] Fix menu heights in Safari.\n[jan] Catch errors from configuration files to avoid blank pages.\n[jan] Support mime_magic extension again if fileinfo is not present.\n"
3.0.3:
  notes: "[mjr] Net_IMSP now correctly handles addressbook names containing spaces (Bug #1286).\n[cjh] Implement clear() in the LDAP prefs driver (Bug #1335).\n[cjh] Don't list uninstalled applications as initial_application options (Bug #1324).\n[jan] Fix postauthenticate hook, not completely denying access after a failed login (Bug #1320).\n[jan] Checkboxes in portal block setup forms are correctly checked now (Bug #1247).\n[mms] Allow IMAP searches to work on headers with multiple entries (kolb@bitlab.hu) (Bug #1330).\n[mms] Correctly sort INBOX subfolders in IMAP_Sort (Bug #1291).\n[cjh] Turn off Form Tokens in the configuration interface.\n[jan] Sort user and group lists in permissions interface (Bug #1305).\n[jan] Allow to enter PHP code in the session timeout configuration (Bug #1302).\n"
3.0.3-RC1:
  notes: "Original version string was 3.0.3RC1\n[mms] Fix bug in Text_Flowed where unquoted lines could not be flowed.\n[cjh] Fix logic problems with the MySQL and OCI8 session handlers that prevented them from handling restarting a session cleanly (Bug #1097).\n[cjh] Fix persistence of $conf['mailer']['params']['auth'] in the Setup UI (Bug #1287).\n[jan] Improve performance of DataTree operations like reading email message histories.\n[jan] Log successful logins and logouts with the NOTICE level (Vilius Sumskas <vilius@lnk.lt>).\n[cjh] Encode HTML entities in Horde_Form_Type_longtext display (Bug #1267).\n[mms] Fix session handling to ensure variables are persistent across function calls (Gary Windham <windhamg@email.arizona.edu>).\n[mms] Improvements to WebCPP MIME_Viewer rendered output.\n[mms] More fixes for URLs with '&amp' when passing through the sanitizer.\n[jan] Make wrapping menus looking nicer in Gecko and KHTML based browsers.\n[jan] Fix MIME viewer for gzip files that don't contain tar files.\n[cjh] Fix visibility of <a > tags inside smallheader blocks for the Cornflower theme (Bug #1206).\n[cjh] Do not cache javascript served via services/javascript.php (Bug #1140).\n[cjh] Fix management of categories that contain quotes (Bug #1202).\n[cjh] Handle addresses that are already surrounded by quotes in MIME::_rfc822Encode() (Bug #1143).\n[cjh] Fix VC_svn's handling of directory names with spaces (Bug #1123).\n[cjh] Fix caching logic that was causing VC to not properly refresh objects in a timely manner.\n[jan] Allow to set fixed table cell widths in WYSIWYG editor.\n"
3.0.2:
  notes: "[cjh] Make sure not to throw errors when bad emails are supplied in services/problem.php (Bug #1070).\n[jan] Fix wrong charset of refreshed menu frame if not using UTF-8 (Bugs #1052, #1055).\n[jan] Fix left menu tree collapsing after each refresh (Bug #1072).\n[jan] Fix sidebar being loaded twice if not using cookies (Bug #1076).\n"
3.0.1:
  notes: "[jan] Test for session.auto_start.\n[mms] Fix parsing of header with undisclosed-recipients (Bug #1057).\n[cjh] Add a browser quirk for browsers that don't support overflow:hidden in table cells (KHTML).\n[jan] Fix application links if not using cookies (Bug #1029).\n[mms] Fix disabling of maintenance confirmations (Bug #1027).\n[cjh] Fix alignment of Help window header in MSIE (Bug #1023).\n[cjh] Fix the Horde_Block graphics to be indexed, not grayscale (Bug #1051).\n[cjh] SECURITY: Close several XSS vulnerabilities.\n[mms] Make sure external URL's work correctly when the URL contains '&amp' as the delimiter.\n[cjh] Fix infinite loop with Auth_application driver (Bug #1004).\n[cjh] Never set an empty Horde_Tree cookie (Bug #1022).\n[mms] Fix displaying of folders in IMAP_Tree:: for IMAP servers that don't use 'INBOX' as their delimiter (Bug #1014).\n[cjh] HORDE_MENU_MASK_NONE now really means only explicitly added menu items are displayed.\n[cjh] Ignore H3 in version comparisons (Bug #1017).\n[cjh] DataTree_null now stubs out the full DataTree API to avoid fatal errors when not using a permanent backend.\n[jan] Fix deleting of identities (Bug #1018).\n"
3.0.0:
  notes: "Original version string was 3.0\n[cjh] Try to catch dangerous URLs in the dereferrer (go.php).\n[cjh] Improve tree graphics for right-to-left languages (Vahid Ghafarpour <vahid@ghafarpour.com>).\n[mms] Fix IMAP_Tree display if folder contains the text 'pop3'.\n[cjh] Fix the Horde_Form date picker popup in Konqueror/Safari (Bug #963).\n[jan] Spaces in tree views with Internet Explorer have been fixed.\n"
3.0.0-RC3:
  notes: "Original version string was 3.0RC3\n[cjh] Always reload frameset after logging in (Bug #814).\n[cjh] Fix menu rendering for IE 5.0/Mac.\n[cjh] Turn off PNG transparency for IE by default.\n[cjh] Allow to pass an array of attributes to Horde::img().\n[cjh] Allow to set a password for the auto authentication driver.\n[jan] Add option for null driver to mailer configuration.\n[jan] Fix configuration of ZPS cache.\n[jan] Fix some javascript errors with IE 5.0.\n[cjh] The \"Horde Purple\" theme is now simply another theme that inherits from the global CSS settings, instead of being both the parent theme as well as a user-chooseable option.  The default graphics are now in a top-level themes/graphics directory as well for use by all themes.\n"
3.0.0-RC2:
  notes: "Original version string was 3.0RC2\n[jan] Show tab with the field that didn't validate on submitted forms.\n[mms] Add a generic MIME_Viewer that will display the raw text of text/* parts that we do not have a specific viewer for.\n"
3.0.0-RC1:
  notes: "Original version string was 3.0RC1\n[cjh] Use HORDE_MENU_MASK_* constants for determining what links are shown on menus.\n[jan] Create default parameters when adding a new block to the portal.\n[mms] Autodetect exact version of IE (5.0+) on login and turn off compression only for buggy versions.\n[cjh] Use an IE behavior for handling alpha transparency with PNG images instead of an onload handler.\n[mms] Allow all folders to be pre-fetched when intializing IMAP_Tree::.\n[mms] Added extensions to the form renderer for the file selection API.\n[cjh] Render all menus as <ul> tags, formatted with CSS.\n[mms] Added example of _imp_hook_spam_bounce to config/hooks.php.dist.\n"
3.0.0-BETA1:
  notes: "Original version string was 3.0.0-BETA\nOriginal version string was 3.0BETA\n[cjh] Allow to insert images from galleries in the WYSIWYG HTML editor (Duck <duck@obala.net>, Roel Gloudemans <roel@gloudemans.info>).\n[mdj] All Horde icons changed from GIF to PNG.\n[mdj] Add /themes directory and group all of each theme's files under a subdir of this directory.\n[jan] Switch from dynamic to static CSS files.\n[mms] Add support for Message Disposition Notifications (RFC 2298).\n[jan] Add TableOperations, ContextMenu and ListType plugins to rich text editor.\n[jan] Add DataTree browser to admin interface.\n[cjh] The Horde_Cache:: API has been completely rewritten to take advantage of the new ZPS4 api for content caching, which allows a more familiar caching API overall. The old zps driver has been dropped because of this.\n[jan] Add Persian (Western) translation (Vahid Ghafarpour <vahid@ghafarpour.com>).\n[jan] Drop usage of arg_separator.output.\n[jan] Make sidebar width a preference (Rick Emery <rick@emery.homelinux.net>).\n[cjh] The Prefs_sql driver now uses DB::prepare/DB::execute for better support of large fields on database backends such as Oracle.\n[cjh] Support custom field mappings in CSV exports, and add an Outlook export type.\n[cjh] The Horde sidebar menu is now built with Horde_Tree.\n[jan] SECURITY: Close an XSS hole in the HTML viewer, a variation to the one reported in http://www.greymagic.com/security/advisories/gm005-mc/.\n[jan] Add configuration option to enable SSL for logins only.\n[jan] Remove share type (private/public).\n[jan] Add framework to clear out user data, e.g. when removing users.\n[jan] Add access keys.\n[jan] Don't require blocks to be registered in the applications' APIs.\n[cjh] Introduce a '_default_' color and better handling of user-specified Unfiled colors.\n[jan] Allow themes to use their own icon sets.\n[cjh] Categories and category color labels are now handled globally by Horde, and provided to all applications that use them.\n[jan] Identities are now managed with the preferences code and can be accessed from every application.\n[mms] Handle RFC 2231 encoded parameter values.\n[mms] Add IMAP_Sort class to provide sorting for IMAP mailbox lists.\n[jan] Add user management to IMAP authentication driver.\n[jan] Add IMAP_Admin class to manage IMAP mailboxes.\n[mms] Added a generic text/html MIME_Viewer driver for all Horde applications that attempts to sanitize malicious code hidden in HTML.\n[mms] Added a generic message/rfc822 MIME_Viewer driver.\n[cjh] Remove HORDE_LIBS constant and assume libraries are in the include_path.\n[jan] Add searching and paging to the user administration interface (Joel Vandal <joel@scopserv.com>).\n"
3.0.0-ALPHA1:
  notes: "Original version string was 3.0.0-ALPHA\nOriginal version string was 3.0ALPHA\n[jan] Access keys are no longer generated automatically but defined by the developers and translators.\n[cjh] The new services/prefs.php file is now the only UI page necessary for preferences for all applications - all app/prefs.php files are now obsolete.\n[cjh] Prefs::getPref() has been deprecated and is no longer present.\n[cjh] Horde::, Registry::, and the last of the libs that are moving should be moved to framework packages now.\n[cjh] Editor::, Menu.php, NLS::, and Signup.php have all been moved to framework packages.\n[mms] Moved the IMAP Tree generation class from IMP to framework so it can be used by other applications.\n[mdj] Setup now has a more informative format. The CVS version tag is copied from the conf.xml file into the conf.php file so that it be used to warn which applications need their conf updated.\n[cjh] Use javascript to autodetect whether or not the frameset is present.\n[cjh] Horde_History, Horde_Links, and Horde_Search have been moved to framework packages.\n[cjh] Allow apps including horde/lib/base.php to specify that a different registry application should actually be pushed onto the Registry application stack. This lets the fiction of problem.php being its own application play nicely with the new permissions checking.\n[cjh] The new application permissions checking has been modified to allow access to all authenticated users by default, and to deny guest access by default. All variations on that must be set explicitly.\n[cjh] Remove the Guest Services link; it's been obsoleted by $conf['menu']['always'].\n[cjh] Various $no_auth and $self_contained_auth flags have been standardized into an AUTH_HANDLER constant, which if defined signals the application that it should not check permissions upon calling $registry->pushApp(), as the calling script will handle that itself, or is a system-level cron job/script/etc.\n[cjh] Add an option to $registry->pushApp() to specify whether or not to check application permissions.\n[cjh] The 'allow_guests' setting, and $registry->allowGuests(), have been removed in favor of Horde_Perms application permissions.\n[mms] Added the text/richtext MIME_Viewer.\n[jan] Instantiate the global Perms object in Registry.php.\n[cjh] Category has been moved to a framework package, and also renamed to DataTree so that it has a more intuitive name for the API.\n[jan] Add Indonesian language (Slamin <slamin@unej.ac.id>).\n[jan] Add Auth_login class.\n[jan] Add Horde::externalUrl().\n[mdj] Perms is now a globally available object, set by the registry's loadPerms().\n[jan] Add \"About\" page for the help system.\n[jan] Add SOAP server to RPC framework.\n[cjh] Move PrefsUI to Prefs/UI.php for package consistency.\n[mms] Added NLS_GeoIP:: to do Hostname -> Country lookups.  NLS:: will do lookups by default now using country TLD codes.\n[mir] Add preprocess hook for Signup system.\n[jan] Move Horde_CLI, Horde_Cache, Horde_Cipher, Horde_Compress, Horde_Token and Horde_Util packages to the framework module.\n[cjh] Reorganize a number of files from the top level and from util/ into a new services/ directory and a number of services/* subdirectories. This should give us a better base for expanding the services provided by the core Horde module in the future.\n[max] Add support for <b> and <i> tags to the Help xml parser.\n[cjh] Add the Horde_History API, for storing timestamped events for arbitrary objects.\n[cjh] Horde_Template now allows if: conditions on array values (Nuno Loureiro <nuno@co.sapo.pt>).\n[jan] The administrator can now force the default language in nls.php (Etienne Goyer <etienne.goyer@linuxquebec.com>).\n[mdj] Horde_Form now supports setting of a help icon linked to help.xml.\n[cjh] mime_mapping.php is no longer a config file; replaced with mime.mapping.php inside the MIME package.\n[cjh] Add Google search applet (Joe Wilson <joe.wilson@mindcandy.org>).\n[jan] UTF-8 support is enabled by default now.\n[jan] Themes are now automatically read from the config/themes directory.\n[cjh] Add support for other kinds of servers and other kinds of responses to rpc.php and the RPC:: API.\n[jwm] Add support for approving queued signup applications.\n[cjh] Groups can now have an email address associated with them.\n[cjh] Make Horde-level Blocks configurable through the registry, allowing easier adding of new blocks (Joe Wilson <joe.wilson@mindcandy.org>).\n[cjh] CategoryTree is now deprecated in favor of Horde_Tree.\n[cjh] Move the admin permissions and groups pages to use Horde_Tree.\n[max] Add _comparePasswords() function to Auth_sql to correctly compare all crypted passwords similar to the Passwd module.\n[max] Add crypt-des (which is the same as crypt), crypt-md5, and crypt-blowfish encryption types, to match Passwd module.\n[max] Add optional show_encryption param to Auth_sql, to match Passwd module.\n[mms] Added IP Address check to Auth::authenticate() to increase security.\n[jan] Remove NLS::decimalFromLocale() and NLS::decimalToLocale().\n[cjh] Horde_VFS:: is now VFS:: again, and has no external Horde dependancies.\n[cjh] Round out the various shell tools with a command shell.\n[cjh] Add sidebar.php and appropriate prefs entries for using Horde with the menu as a Mozilla sidebar.\n[mms] Add IMAP_Cache:: class to handle cached IMAP server data.\n[cjh] Make getCategoriesByAttributes() much more sophisticated - it can now handle a pretty much arbitrary logic tree - and use it to optimize Horde_Share::listShares().\n[cjh] Add getCategoriesByAttributes(), and use it in Group::getGroupMemberships().\n[cjh] Add code that lets a CategoryObject subclass define a mapping from its internal data to the new horde_category_attributes table.\n[mms] IMAP_Search:: now uses a IMAP_Search_Query:: object to build the actual IMAP search.\n[mms] Added a secure delete temp file option that will overwrite any temp file with random data before unlinking.\n[jan] Add Lavender theme (Ziaur Rahman <zia@qalacom.com>).\n[cjh] Horde_Template:: is now capable of translating text inside <gettext></gettext> tags.\n[cjh] Horde_Mobile:: now properly supports multiple submit elements in forms.\n[mac] Add generic Cyrus auth driver, Auth_cyrus.\n[mac] Add optional encryption param to Auth_sql, to match Passwd module.\n[jan] Add new hooks (replacing _horde_hook_username) to convert user names from the backend to Horde and back.\n[cjh] Add a new API call, Auth::isAuthenticated($realm = null), for determining whether or not a user is logged in to the current realm (by default null). Auth::getAuth() is still used to get the current user, but now you don't need to know the auth realm to get the current user - just to check authentication.\n[cjh] DHTML date picker now opens right over the image used to anchor it.\n[cjh] The last_login preference is now entirely handled by Horde.\n[mms] Add Horde_Test:: class/templates to aid in creating test.php scripts.\n[mms] Move complex IMAP searching code from IMP_Search:: to IMAP_Search::.\n[cjh] Re-work the Horde LDAP schema bits to be more correct and consistent (Adam Tauno Williams <adam@morrison-ind.com>).\n[mms] Add DOM tooltip capability via Horde::linkTooltip().\n[mms] Add garbage collection class (Horde_VFS_GC::) for VFS.\n[mms] Add timeout to PGP keyserver lookup.\n[cjh] Add navigation for previous/next preferences block in PrefsUI (Mathieu CLABAUT <mathieu.clabaut@free.fr>).\n[cjh] Add Horde_Links API (j.huinink@wanadoo.nl).\n[cjh] Add more introspection, in the form of getContentType() and getLink(), to the Horde_Image:: API.\n[cjh] Add util/cacheview.php for viewing any data with a Content-type put into the cache.\n[cjh] Add Horde_Cache::cacheObject() for use in caching the results of non-static object methods.\n[cjh] Rename Cache:: to Horde_Cache::.\n[cjh] Move Cache_session:: to Horde_SessionObjects::.\n[mms] Added Horde::extensionExists() to cache extension_loaded() calls.\n[cjh] Add NLS::decimalToLocale() and NLS::decimalFromLocale() to handle converting between different decimal point separators.\n[cjh] Added MIME_Headers::.\n[mms] Moved gzip and tar file handling to Horde_Compress_*:: modules.\n[mms] Moved ZIP handling to the Horde_Compress_zip:: module.\n[mms] Moved TNEF handling to the Horde_Compress_tnef:: module.\n[mms] Added Horde_Compress:: API - used to compress/decompress data.\n[mdj] Added the DOM calendar date picker to Horde_Form, based on work by Mike Cochrane <mike@graftonhall.co.nz> and Brian Keifer <brian@valinor.net>.\n[mms] Added multipart/report MIME_Viewer::.\n[mms] Added MIME::generateMessageID() to generate MIME-compliant message IDs.\n[cjh] Add command-line setup.php script. Right now, this only generates/updates configurations; you cannot *edit* a configuration with it.\n[jan] Add String:: class with locale/charset safe string functions.\n[mms] Added Horde::authenticationFailureRedirect().\n[mms] Added Browser::escapeJSCode() to escape certain characters in javascript code depending on the browser type.\n[jan] Add NLS::strtolower() and use it everywhere where locale independance is necessary.\n[jan] Add Turkish translation (Genco Yilmaz <gencoyilmaz@yahoo.com>).\n[mms] Add 'link' parameter to the preferences config to allow for help links to be added to the preferences pages.\n[mms] Another Maintenance:: rewrite - now store all data in the cached Maintenance_Tasklist object.\n[mms] Added check to Prefs:: to ensure the data stored does not exceed the maximum storage size of the preferences storage system.\n[jan] Add UTF-8 support. Any content with any charset can now be displayed with any translation.\n[mms] Add NLS::checkCharset() to determine whether a given character set is valid on the current system.\n[cjh] Deprecated Registry::includeFiles() and Registry::shutdown().\n[mms] Add support in MIME_Magic:: to use the UNIX file function to determine the MIME type of unknown files.\n[mms] Added an example cron script to delete old temporary files.\n[mms] Correctly get charset information for MIME_Parts in MIME_Structure.\n[mms] Rewrote MIME_Message to extend MIME_Part.\n[cjh] Add ordering extensions to the Category:: framework (Marko <marko@oblo.com>).\n[cjh] Add a simple template engine, derived from bTemplate, for Horde applications to use.\n[cjh] Add Auth_yahoo:: which lets you have no local auth and rely on Yahoo! mail usernames.\n[mms] Moved Server configuration checking functions to Server::.\n[cjh] The user admin page can now set fullname and from_addr preferences for any user as long as the Auth backend is capable of at least listing users (doesn't have to be able to update them).\n[cjh] Share:: is now Horde_Share::, and is reworked to hold permissions internally. We can now assign group/default/guest permissions more easily.\n[jan] Add RPC::parseUrl().\n[jan] Add RPC based remote summaries.\n[cjh] Add a SQL Shell to the Horde admin section.\n[cjh] Don't prefix Horde admin menuitems with \"Horde\" to save space.\n[cjh] Horde_Form:: forms now use the Horde_Token:: API by default to make sure that they cannot be reloaded.\n[cjh] Rename Token:: to Horde_Token:: for future packaging.\n[jan] Add Registry::listAPIs() and Registry::listMethods().\n[cjh] The Perms:: system now supports default and guest permissions.\n[cjh] Applications can now provide individual registry methods, not just whole interfaces. Applications can override a single method out of an interface as well - an app providing a mail/filter while IMP provides mail/*, e.g.\n[cjh] Renamed FormSprocket:: to Horde_Form:: and GraphSprocket:: to Horde_Graph:: for consistency and future PEAR packaging.\n[mir] Added example of _imp_hooks_fetchmail_filter to config/hooks.php.dist\n[mms] Added the MIME_Contents:: class; functions to help in the output of MIME content.\n[cjh] Rewrite the Category:: system to allow multiple leaves with the same name (as long as they have different parents) and rewrite everything (Perms::, Group::, Share::, etc.) to use it.\n[cjh] Move _fileCleanup() into Horde:: as Horde::deleteAtShutdown(), and add Horde::_deleteAtShutdown() to do the actual deleting.\n[cjh] Initial support for configuring the summary screen (Eric Rechlin <eric@hpcalc.org>).\n[cjh] Add a system for defining generic hooks for any preference. See horde/config/hooks.php.dist for lots of examples and docs.\n[cjh] Add a colorpicker utility to Horde (Michael Cochrane <mike@graftonhall.co.nz>).\n[cjh] Add a guest services entry page and links to it from all login pages.\n[jan] Add translation helper script.\n[mms] Stylesheet link generation handled by Horde::stylesheetLink().\n[cjh] Add the new Config:: API and setup.php, a system which reads configurations from XML files and existing conf.php files, taking care of merges and adding new parameters. Currently we have a web wizard.\n[cjh] css.php now supports loading CSS classes for multiple applications.\n[mms] Removed the SessionCache class. Equivalent code is now available in the Cache_session:: class.\n[mms] Added IE broken-browser downloading code to Browser::.\n[mms] Added a session driver to Cache::.\n[cjh] Rename config/horde.php to config/conf.php.\n[cjh] Move cookie_domain, cookie_path, server_name, and server_port into horde/conf.php.\n[cjh] Add a parameter for setting the session cache_limiter.\n[cjh] Add MIME_Viewer_text to Horde.\n[cjh] Rewrite all factory/singleton methods to allow individual applications to provide a custom backend, and to allow sites to provide custom backends in their include_path settings.\n[mms] Handling of Content-Type parameters moved to MIME_Part from MIME_Message.\n[mms] Crypt_pgp:: can now upload keys to a public keyserver.\n[mms] Renamed the Lang:: class to NLS:: and moved the timezone setting method into it.\n[mms] The local timezone can now be set via the Horde::setTimezone() call.\n[mms] All browser headers for downloading a file have been moved to the Browser:: class.\n[cjh] Add files to util to support embedding a GUI editor into our pages.\n[mms] MIME:: no longer exports $mime_types and $mime_encodings as global variables - rather, MIME::type() and MIME::encoding() should be used.\n[mms] The tgz MIME_Viewer now lists all files without using an external helper program (Michael Cochrane <mike@graftonhall.co.nz>).\n[mms] The rar MIME_Viewer now lists all files without using an external helper program (Michael Cochrane <mike@graftonhall.co.nz>).\n[mms] The zip MIME_Viewer now lists all files without using an external helper program (Michael Cochrane <mike@graftonhall.co.nz>).\n[mms] Maintenance:: now uses session variables to provide much cleaner and more robust performance.\n[mms] MS-TNEF attachments are now handled completely via PHP rather than with an external program.\n[mms] Added application/ms-tnef MIME_Viewer.\n[mms] Horde_Crypt_pgp class can query public keyservers.\n[mms] MIME_Structure::parseMIMEHeaders() can now parse all headers of a MIME message and return an object.\n[jan] Add MIME::rfc822WriteAddress() to replace imap_rfc822_write_address().\n[mms] Added S/MIME MIME_Viewer.\n[jon] Support referrals between LDAP servers in the LDAP preferences driver (Kevin Hildebrand <kevin@hq.ensoport.com>).\n[mms] MIME_Structure::parse() now returns a MIME_Message object.\n[cjh] Configure administration services in the Registry (Marcus I. Ryan <marcus@riboflavin.net>).\n[cjh] Add API methods for getting the preferences and identities of users other than the logged-in user.\n[cjh] Allow setting the Content-Disposition of MIME_Part objects.\n[mms] Add Crypt:: framework.\n[max] Add Brown Horde theme (Marco Obaid <marco@muw.edu>).\n[jon] Allow the LDAP version to be specified for the LDAP preferences driver.\n[jan] Add theme preference.\n[jan] Add callback funtion for preferences.\n[jon] Remove the $conf['menu']['floating_bar'] functionality.\n[jan] Load only login page on startup and redirect to frameset after login.\n[cjh] Don't allow anonymous access to problem.php.\n[cjh] Add en_GB locale.\n[cjh] Remove extensions on temporary files; this is a temp race hole.\n[cjh] Allow for auto-creation of permissions (multiple levels of hierarchy).\n[cjh] Add adding/removing of users from groups.\n[cjh] Create temp files with the right extension in MIME_Viewer_enscript:: so enscript has more clues to guess file type.\n[cjh] The admininstration interface for Groups and Permissions is now mostly functional.\n[cjh] Make application authentication an Auth:: driver, instead of a special Registry case.\n[cjh] Fix problems with the Notification stack and register_globals being off.\n[jon] Alter Horde::img() to explicitly accept an alt=\"\" attribute. Horde::img() now generates title=\"\" attributes based on the alt=\"\" text, too.\n[cjh] Notification::notify() passes the message stack to all listeners, so that listeners don't have to know about the message stack, and app writers don't have to know about all possible listeners.\n[cjh] Replace the HORDE_* message constants with 'horde.error', etc. for greater flexibility.\n[cjh] Remove Horde::raiseMessage() now that the Notification system provides that functionality.\n[cjh] Use the new Notification system.\n[cjh] Remove other Registry get() methods.\n[jon] Remove support for the horde_language cookie.\n[mms] Move the maintenace framework from IMP to Horde.\n"
2.2.9:
  notes: "[jan] SECURITY: Fix potential XSS vulnerability due to not properly escaped error messages.\n"
2.2.8:
  notes: "[jan] SECURITY: Close XSS when setting the parent frame's page title by javascript (cjh).\n"
2.2.7:
  notes: "[cjh] Restore compatibility with PHP 4.1.\n[jan] SECURITY: Fix potential XSS vulnerability in the help window.\n[jan] Fix charset for Latvian translation (Bug #656).\n"
2.2.6:
  notes: "[jan] Use DB::prepare/DB::execute ONLY for Oracle to avoid implicitly requiring PHP 4.2 for all other RDBMs.\n[cjh] Fix Oracle session handler.\n[cjh] Add SQL scripts for Oracle and PostgreSQL session handlers.\n[jan] Don't strip trailing spaces from signature dashes in IMP.\n"
2.2.6-RC1:
  notes: "[cjh] Fix support for custom session handlers.\n[cjh] Use DB::prepare/DB::execute in the Prefs_sql driver for better support of large fields on databases such as Oracle.\n[jan] Show the user's full name on the summary screen directly after logging in (D. Adam Karim <adam@akarsoft.com>).\n[jan] Fix javascript error in \"Problem\" page with some translations (Bug #61).\n[cjh] Fix handling of PostgreSQL blobs (Bug #44).\n"
2.2.5:
  notes: "[jan] Add Indonesian language (Slamin <slamin@unej.ac.id>).\n[jan] Add Galician translation (Rafael Varela Pet <srrafa@usc.es>, Guillermo Mendez <guille@usc.es>).\n[mms] Fix downloading of files with spaces in Mozilla.\n"
2.2.4:
  notes: "[mdj] SECURITY: Add dereferer to strip off session information from links to the outside of the Horde system to protect against session hijacking.\n[mms] SECURITY: Add code to protect against session fixation issues.\n[jan] Fix a bug with importing vCard 2.1 data.\n[jan] Add Arabic (Syria) translation (Platinum Development Team <devteam@platinum-sy.net>).\n[jan] Add Macedonian translation (Stojan Pesov <ssp@eureka.com.mk>).\n[mir] Fix a bug that incorrectly quotes pref values (Bug #1224)\n[cjh] Fix a bug that prevented logging.\n[mms] DB session handlers do not use persistent connections by default.\n"
2.2.3:
  notes: "[mms] Fix parse error in Horde_Cipher_BlockMode_ofb64::.\n"
2.2.2:
  notes: "[mms] Optimization of Secret:: and Horde_Cipher:: drivers.\n[jan] Add Catalan translation (Angels Guimerà <angels.Guimera@uab.es>).\n[mms] Added a RADIUS Auth:: driver.\n[mir] Added a Samba Auth:: driver.\n[cjh] Added the Horde_Image:: class.\n"
2.2.1:
  notes: "[jan] Fix incompatibility with PHP < 4.2.0 in the SQL VFS driver.\n[jan] Fix undefined variable in Cipher.php (cjh).\n[mms] Complete merging of SQL session handler.\n"
2.2.0:
  notes: "Original version string was 2.2\n[cjh] Add support for user-defined session handlers (Mike Cochrane <mike@graftonhall.co.nz>).\n[mac] Change Secret:: from using PEAR Crypt_HCEMD5 to the Horde_Cipher class.\n[mac] Add Horde_Cipher:: class to provide a common abstracted interface to various Ciphers for encryption of arbitrary length pieces of data.\n[mms] Correctly get charset information for MIME_Parts in MIME_Structure.\n[jan] Add Latvian translation (Kaspars Kapenieks <kaspars@rcc.lv>).\n[jan] Add Romanian translation (Corneliu MUSAT <cmusat@tiamat.keysys.ro>).\n[jon] Added support for an <eref> entity to the help system.  This allows an external link to be embedded in a help entry. (<g.hort@unsw.edu.au>)\n[cjh] Rename VFS:: to Horde_VFS:: for PEAR packaging.\n[cjh] VFS:: is now packaged so that it can be exported as a PEAR component.\n[cjh] Add a multi-user SQL VFS backend (Mike Cochrane <mike@graftonhall.co.nz>).\n[cjh] The VFS api now consistently takes a temp file in the write() method across all backends (Michael Varghese <mike.varghese@ascellatech.com>).\n[cjh] Add a VFS API for storage of files in an abstracted filesystem.\n[cjh] Add a preference to allow maintenance ops with no confirmation screen\n[cjh] Replace 'show' attribute in the registry with a more flexible 'state' attribute.\n[jan] Allow setting the number of columns in the summary screen as a user preference (Brian Keifer <brian@valinor.net>).\n[cjh] Add Horde::getGet() and Horde::getPost().\n[cjh] Add an initial_application preference so users can select an app to be taken to instead of the Horde Summary on login.\n[cjh] Make text, icon, or both menus a user preference (KaalH! <kaalh@smol.org>).\n[cjh] Add a parameter for setting the session timeout.\n[cjh] Add a parameter for setting the session delimiter.\n[mms] Add MIME_Magic::filenameToMIME().\n[jan] Use arg_separator.output instead of hardcoding '&' (David Ulevitch <davidu@everydns.net>).\n[jan] Add Notification::count() (David Ulevitch <davidu@everydns.net>).\n[cjh] Add Auth::isAdmin().\n[cjh] Allow loading of sub-classes from several additional sources.\n[jan] Remove references to not yet released applications (Gollem, Troll).\n[cjh] Rewrite Category_sql implementation to be much more efficient.\n[jan] Add Lithuanian translation (Darius Matuliauskas <darius@lnk.lt>).\n[mms] Add Horde::compressOutput().\n[mms] Add a kerberos Auth:: driver.\n[jan] Add Bulgarian translation (Miroslav Pendev <pendev@hotmail.com>).\n[jan] Remove deprecated DB::isWarning() calls.\n[mms] Add Horde::createTempDir().\n[cjh] Add Horde::usingSSLConnection().\n[cjh] Replace <?= with <?php echo to remove the short_open_tags requirement.\n[jan] Add Text::toHTML(), Text::highlightQuotes() and Text::dimSignature().\n[cjh] Add Registry::listApps().\n[cjh] Add Prefs::getPref() for getting preferences for someone other than the logged-in user.\n[cjh] Add the ability to load identities for someone other than the logged-in user.\n[mms] Add Horde::removeParameter().\n[mms] All browser headers for downloading a file have been moved to the Browser:: class.\n[jan] Add detection for UTF capability to Browser class.\n[mms] Added images MIME_Viewer.\n[bjn] Add PostgreSQL command flag (Richard G Konlon <RGKonlon@1MailPlace.com>).\n"
2.1.0:
  notes: "Original version string was 2.1\n[jan] Add Hungarian translation (Laszlo L. Tornoci <torlasz@xenia.sote.hu>).\n[jan] Add Norwegian Nynorsk translation (Per-Stian Vatne <psv@orsta.org>).\n[jon] Major overhaul to the LDAP preferences driver. Note the changes to config/horde.php and scripts/ldap/horde.schema when upgrading.\n[jan] Add Slovenian translation (Jure Krasovic <jurek@rcc-irc.si>).\n[cjh] Add a Horde preferences screen, and a preference to refresh the summary screen.\n[cjh] Add text/enriched MIME_Viewer (Eric Rostetter <eric.rostetter@physics.utexas.edu>).\n[jan] Improve language selection.\n[jan] Add Japanese translation (B.J. Black <william.black@sun.com>).\n[cjh] Close a potential problem with register_globals On and $js_onLoad.\n[jan] Add Prefs::isDefault() method to determine if a preference's value is set by the user or the default value from prefs.php.\n[jon] Overhauled LDAP preferences driver.\n[cjh] Make Horde::dispelMagicQuotes() recursive, so that it handles arrays.\n[cjh] Have Secret::setKey() check for the session cookie explicitly, to avoid problems with old cookies being sent to a site when they are really disabled.\n[cjh] Add a PrefsUI class for handling the form processing and UI generation for user preferences; this code was duplicated all through Horde.\n[cjh] Add a mapping function to the enscript driver which maps file extensions to enscript language codes, and pass the language directly to enscript, to avoid having to use a file extension.\n[cjh] Fix MIME_Magic::MIMEToExt() to work with x-extension/ext types.\n[cjh] Add MIME_Magic::MIMEToExt() to map MIME types to file extensions.\n[cjh] Rewrite Perms:: to use the Categories backend.\n[jan] Change the Norwegian Bokmal locale from no_BOK to nb_NO and make it the default language for Norwegian users.\n[cjh] Make Horde's login screen nicer; include reasons in it.\n[cjh] Use HORDE_TEMPLATES for all template paths.\n[cjh] Use $registry->get() for all Registry information.\n[cjh] Removed administration code which is incomplete and confusing to users.\n[jan] Add Estonian translation (Toomas Aas <toomas.aas@raad.tartu.ee>).\n[jan] Add Slovak translation (Leo Mrafko <leo@oel.sk>).\n[jon] Enable the \"portability\" option in the PEAR DB (sql) drivers.\n[cjh] Use Horde's 'initial_page' configuration value in the Horde frameset.\n[jan] Add Portugues translation (Nuno Loureiro <nuno@eth.pt>).\n[jan] Rebuild the language selection logic. The language selected on the login screen is now respected and the site's standard language is defined in lang.php instead of each application's preferences.\n[jan] Add javascript to set the frameset's page title (Michael Cochrane <mike@graftonhall.co.nz>).\n[jan] Add Ukrainian translation (Andriy Kopystyansky <anri@polynet.lviv.ua>).\n[jan] Update gettext documentation and Makefiles for Solaris and Debian.\n[jan] Add Danish translation (Martin List-Petersen <martin@list-petersen.dk>).\n"
2.0.0:
  notes: "Original version string was 2.0\n[jan] Add Norwegian Bookmal translation (Oystein Steimler <oystein@rexta.net>).\n[avsm] Add .htaccess files to deny access to data directories.\n[jan] Add Finnish translation (Leena Heino <liinu@uta.fi>).\n[cjh] Fix one last problem with POP3 and multipart/alternative attachments.\n"
2.0.0-RC4:
  notes: "Original version string was 2.0RC4\n[rich] Include rewritten and reorganized documentation.\n[cjh] Add an MSPowerpoint MIME_Viewer.\n[jan] The language cookie was removed in favor of new methods in the Lang:: class that select the language and set the gettext domain.\n[avsm] Include Chora in this release cycle, but not showing in the toolbar.\n[cjh] Add MIME_Viewer_zip.\n[cjh] Trim registry.php.dist to only list apps in this release cycle.\n[jan] Add deleteObject() method to the SessionCache class.\n[bjn] Change 'en' and 'en_EN' locales to 'en_US' (default).\n"
2.0.0-RC3:
  notes: "Original version string was 2.0RC3\n[cjh] Recognize a few Palm.net browsers and set quirks/features accordingly.\n[cjh] Support for adding and listing LDAP users given a set schema.\n[cjh] Set the session cookie parameters with our cookie_path/cookie_domain settings. This means that you can be logged into multiple Horde installations on the same server (different paths) and not have the sessions interfere.\n[cjh] Use 'hostspec' consistently in Auth drivers.\n"
2.0.0-RC1:
  notes: "Original version string was 2.0RC1\n[jan] Add Brazilian Portuguese translation (Carlos Daniel Kibrit <kibrit@terra.com.br>).\n[jan] Add Greek translation (Stefanos I. Dimitriou <sdimitri@teiath.gr>).\n[jan] Add vCard MIME driver. Changed config/mime_drivers.php.dist.\n[jan] Add Swedish translation (Andreas Dahlén <andreas@dahlen.ws>).\n[jan] Add Korean translation (J.I Kim <aporie@netian.com>).\n"
1.3.5:
  notes: "[jon] Added $file and $line parameters to Horde::fatal().\n[jon] Removed the PREFS_* and AUTH_* constants in favor of PEAR_Error objects.\n[avsm] Don't depend on the registry being available when displaying the 'Horde is not configured' message.\n[cjh] Clean up the Identity class to be a generalized, clean piece of the framework that can be used in other apps and subclassed if necessary.\n[cjh] Make failure to connect to the preferences datasource a fatal error.\n[cjh] Added the Serialize:: class for various methods of encapsulating data (steph <shuther@yahoo.fr>).\n[cjh] Added the capability to get authentication credentials other than username back from the Auth framework, and completed the authentication realm functionality.\n[jon] Allow the table cell and link CSS classes to be specified when creating menu items.\n[jan] Add registry method for linking to a nag task.\n[jan] Add identity class.\n[max] Add Registry::getName() for querying application names.\n[cjh] Horde now provides the Horde::logMessage() method for logging of information according to configurable priorities, etc.\n[jan] Add functionality to map date and time fields to the Data class.\n[cjh] Add the beginnings of a user administration system.\n[cjh] Add Chinese (Traditional) translation (David Chang <david@thbuo.gov.tw>).\n[jan] Add Italian translation (Giovanni Meneghetti <gmeneghetti@infvic.it>).\n[jan] Add Data class for importing and exporting data.\n[jon] Cleaned up the help system a bit.\n[cjh] Add Horde::fatal() for displaying PEAR_Error objects and aborting.\n[avsm] Extend Horde::getTempFile() to allow directory to be overridden.\n[avsm] Allow temporary files to be unregistered from deletion.\n[avsm] Add a Cache framework for persistently storing objects, along with a filesystem driver.\n[jan] Add Polish translation.\n[cjh] Fix a problem with $registry->call() and switching application contexts.\n[cjh] Get rid of the invoke() methods in the registry.\n[cjh] Don't re-include application config files; save configs in a cache so that we can just point $GLOBALS['conf'] at the old config on $registry->popApp(), etc.\n[jan] Add French translation (Frederic Trudeau <ftrudeau@CAM.ORG>).\n[cjh] Add Czech translation (pchytil@asp.ogi.edu).\n[jan] Add new timezone handling with cleartext timezone names in lang.php.\n[cjh] Add Russian translation (Ignat Ikryanov <ignat@ibd.ru>).\n[jon] New methods in Browser.php for retrieving versions. <izzy@qumran.org>\n[jon] Browser.php now detects Opera. <izzy@qumran.org>\n[cjh] Move the language and charset defaults into config/lang.php, and add a Registry method to get the current charset.\n[cjh] Map browser codes such as 'nl' to the full code ('nl_NL', etc.).\n[avsm] Replace $conf['paths'] with the $registry equivalents.\n[avsm] Add four registry functions to query webroots and paths.\n[avsm] Many MIME_Viewer changes: API tweaks, new drivers, works with IMP.\n[cjh] $conf['user']['online_help'] is now a Horde-level setting.\n[avsm] Enable applications to have local MIME_Viewer drivers in addition to the global Horde ones.\n[avsm] Shuffle around the MIME_Viewer API: getDriver() is now private\n[avsm] Add an 'initial_page' option to the registry, to let us link into any page inside an application.\n[cjh] Add a framework-level base.php file and make framework scripts use it.\n[cjh] Add re-organized but still mostly out of date HELP/LISTS/SOURCE files (Josh Miller <joshlists@nebonet.com>).\n[cjh] Add a parameter that determines whether or not apps are linked on the Horde menubar.\n[cjh] Clear the whole session when the user logs out of Horde.\n[jon] Added Prefs::isEmpty() for determining whether a preference is empty.\n[jon] Added an $onclick parameter to Horde::link() for specifying an anchor's 'onclick' JavaScript event.\n[cjh] Use the *url() functions more consistently to make sure that cookie-less sessions work.\n[cjh] Modify css.php to use the Registry to get application file paths.\n[cjh] Add cookie_path and cookie_domain settings for people who keep apps outside of the Horde webroot or on multiple servers.\n"
1.3.4:
  notes: "[cjh] Add a Horde summary framework, which uses the Registry to get summaries of available data - tasks, events, etc. - for the Horde login screen.\n[cjh] The preferences settings should be Horde-wide, and so have been moved to horde/config/horde.php.\n[cjh] Move prefs.gif and generic prefs templates into Horde.\n[cjh] Move setting of the gettext domain into the Registry.\n[jon] Simplified the preference system's cleanup functions.\n[jon] Merge doctype.inc into common-header.inc.\n[jon] Added Text::htmlspaces() and Text::htmlallspaces().\n[cjh] Add an option to Horde::getTempFile() to not delete the file at the end of the request.\n[cjh] Add a &singleton() method to the Registry class.\n[jon] Added Nag interface to the registry.\n[jon] Expanded the registry to handle importing application-specific configuration values.\n[max] Add auth/login and auth/logout options for Gollem in the registry.\n[max] Add Registry::getMethod function.\n[max] Add contacts/sources service to the registry.\n[cjh] Rename the Connection classes to Token.\n[cjh] Rename the ObjectStore class to SessionCache.\n[jon] Adding Dutch language.\n[avsm] Add icon support to the MIME_Viewer framework\n[avsm] Update the MIME_Viewer API to include getDriver() and getIcon()\n[jon] Overhauled the preferences caching system a bit.\n[cjh] Update Browser:: to recognize IE6.\n[jon] Added Horde-wide and driver-specific cleanup methods to the preferences system.\n[cjh] Remove the strtolower() from Lang::select() which was preventing proper locale names (like pt_BR) from working correctly.\n[max] Added authentication handler to the Registry.\n[jon] The 'session' preferences driver now honors preference scope.\n[max] Made sitename title configurable.\n[jon] Reworked the Menu::customItem() to accept PHP data structures instead of a string of encoded parameters.\n[avsm] Added MIME_Viewer framework to handle rendering files into HTML (and other) formats in a user-extensible fashion (experimental)\n[avsm] New MIME_Magic and mime_mapping.php config file (experimental)\n[avsm] Two new temporary file handling functions, Horde::getTempFile() and Horde::getTempDir() to take care of the housekeeping of temp files.\n[max] Added contacts/add service to registry.\n[cjh] Registry::call() is now Registry::link(). There is a new Registry::call() which actually returns the result of a function call made to another application.\n[cjh] Fix DB query result checking in sql drivers.\n[cjh] Fix help so that generic help links (on menu bars) show the topic list correctly.\n[cjh] Make the login form nicer, and add a logout link.\n[cjh] Make sure all of the sql drivers use DB::quoteString() on all strings.\n[cjh] Replace a @mysql_query() that was hiding in Connection/sql.php with $this->db->query().\n[cjh] Return basename($language) from Lang::Select() to avoid possible exploits.\n[cjh] Add Registry::hasMethod() for checking if a piece of functionality has been registered with Horde.\n[jon] Another large overhaul to the preferences system.  Note that the isChangeable() function has been renamed isLocked().  There is also support for preference scope (via isShared() and setShared()).\n[jon] Added capaiblity tests to those drivers that require non-standard PHP extensions (handled by Horde::functionCheck()).\n[jon] Added an Auth_LDAP Horde authentication driver.\n[cjh] Add little snippet-templates for dynamically building preference GUIs.\n[cjh] Rename the Auth interface's auth() method to authenticate() to avoid overlapping the name of the constructor for the Auth parent class.\n[cjh] The configuration array is now simply $conf. Any settings that must be accessible unchanged (not overridden) should be put into $conf['horde']. Everything else is fair game for applications to override.\n[cjh] Add a wml/wap login form.\n[max] Add an Auth_FTP Horde authentication driver.\n[cjh] Add an Auth_MCAL Horde authentication driver.\n[cjh] The Horde login form now actually does something. Logging in to it gets you a token in your session saying that you've authenticated and who you are. Apps can then use this information to allow or deny access, and to identify users.\n[cjh] The format of the config/registry.php file has changed drastically to be more readable and less indirect. There is also a new app parameter, 'allow_guests', which defines whether or not a user is allowed to access the application without logging in to Horde.\n[cjh] The Auth:: classes now expect to receive a userid and an array of credentials. Right now all backends assume that those credentials contain a password, but the way is clear to have other kinds of auth (IP, time-based, whatever).\n[jon] Added a new parameter to the LDAP preferences driver: 'always_bind'.\n[cjh] Added a Menu:: class that all modules can use to generate menu items.\n[jon] Cleaned up the LDAP preferences driver a bit.\n[jon] Added session-level preferences caching to the preferences system.\n[cjh] Have Horde::link() make sure that the status text is safe for javascript (htmlentities, addslashes).\n[cjh] Fix ObjectStore to work when register_globals = On.\n[jon] Added a Session-based preferences driver.\n"
1.3.3:
  notes: "[cjh] Further revamp the MIME interface. Be consistent in capitalization (acronyms are capitalized), break out MIME_Structure and MIME_Message into seperate files, and put all methods into classes.\n[cjh] Add Horde::getFormData() to fetch a variable from either $HTTP_POST_VARS or $HTTP_GET_VARS (and to clean magic quotes, if necessary).\n[cjh] Remove the Log:: class. This is part of PEAR now.\n[cjh] Add a SessionCache:: class. This is intended for storing objects in the session intended for near-term use, and will currently start throwing out objects when more than 20 are put in. This will hopefully keep any one session from growing too large.\n[cjh] Use the new PEAR class Mail_rfc822:: to parse address lists, so that we get rfc 822 group support (my-buddies: jon@horde,org, max@horde.org;), which imap_rfc822_parse_adrlist() doesn't have.\n[max] Make Horde XHTML 1.0 compliant.\n[cjh] Add a few fields to the problem report and try to make it more friendly.\n[cjh] Flesh out the Mime:: class.\n[cjh] Move trimEmailAddress() into the new Mime:: class.\n[cjh] Move set_env_in_string() to Text::expandEnvironment().\n[cjh] Rename horde_cleanup() to _fileCleanup().\n[cjh] The zlib module now supplies a gzencode() function that obsoletes HTTP_Cache::gzEncode().\n[cjh] Modify Horde::url() so that it defaults $conf['use_ssl'] to 2 (auto-detect current mode).\n[cjh] Modernize some of the Horde frontend (still lots to do here); get rid of package.HTMLDocument.php once and for all.\n[avsm] Breakdown all special characters in URLs to entities, to avoid ambiguity in how various browsers parse them.\n[cjh] Add Horde::raiseMessage() for creating Horde messages to be displayed to the user.\n[cjh] Some general UI tweaks - font size, etc.\n[cjh] Remove rfcdate() in favor of the new 'r' parameter to date.\n[cjh] Added application 'webroot' and 'fileroot' properties to the registry config file. These allow more flexibility in placing apps, and let the registry work from more places.\n[cjh] Moved package.Registry.php to Registry.php.\n[cjh] Commented config/horde.php.dist heavily.\n[cjh] Add a Secret:: class to Horde.php that provides a transparent interface to either the mcrypt extension (preferred) or the PEAR Crypt_HCEMD5:: class.\n[jon] Accept a user-defined function for performing username lookups in the preferences code.  The preferences constructor looks for the function in $params['user_hook'].\n[cjh] Check HTTP_ENV_VARS for the user-agent as well as HTTP_SERVER_VARS.\n[cjh] Remove mailfrom() in favor of the PEAR Mail:: interface. Adjust the conf files and problem.php accordingly.\n[cjh] Add a set of invoke() methods to the Registry:: class for directly invoking services (ie, actually popping up a window) instead of printing links to invoke them.\n[cjh] Clean up package.Mime.php a bit; don't set a charset on MIME parts that aren't text.\n[cjh] Added a file driver for the Connection:: class.\n[cjh] Added a WAP index to provide quick links to all Horde wireless pages.\n[cjh] Add basic WAP browser detection to Browser::. Currently this is of the \"it detects the phone I have and the simulator I use\" variety; it is _very_ far from complete.\n[cjh] Added Max Kalika's Connection:: class for connection tracking.\n[cjh] HTTP_Cache:: now compresses content without the use of a temp file.\n[cjh] Fleshed out the Auth:: class with the ability to cache authorization in the session.\n[jon] Removed the scripted wordwrap in favor of the native function.  Moved the wrap_message() function to Text::wrap().\n[jon] Standardize on the rfcdate() function in lib/Horde.php.\n[cjh] The prefs drivers now expect $params['hostspec'], for consistency with PEAR.\n[cjh] The PEAR sql prefs driver now works.\n[cjh] Move horde configuration values that should not be overridded by modules into $horde['horde'][] to allow modules to do overriding/inheritance of other options.\n[cjh] Add the HTTP_Cache:: class to Horde.php for ETag generation, gzip compression of http content, etc.\n[cjh] Replace $horde['localhost'] with $HTTP_SERVER_VARS['SERVER_NAME'].\n[cjh] Reject outright envelope From addresses with spaces in them.\n[cjh] Quote the from address passed to sendmail to prevent shell exploits.\n[cjh] Update Browser.php to use HTTP_SERVER_VARS, consolidate the javascript version information, and add ssl_download_hack for browsers that need downloads to be cacheable.\n[jon] Add Text::filter to lib/Horde.php.\n[cjh] Check the return value of pclose() correctly in mailfrom().\n[jon] Security fix for $from value in mailfrom(). <cw@coc-ag.net>\n[jon] Silence session_start warnings.\n[jon] Added new |extra| substitution to config/registry.php for extra, non-standard parameter passing.\n[jon] Remove buildURL().  It's been replaced by Horde::url().\n[jon] Restructured the SQL preferences schema.\n[cjh] Added $horde['session_name'] to control the session name globally.\n[cjh] Session:: doesn't really buy us anything, so we've moved the utility methods that do into Horde::, and are just using php4 session calls elsewhere.\n[cjh] Added the beginnings of User and Auth interfaces, with a bare-bones working Auth_sql implementation.\n[jon] Rewrote the Session class for instantiation with hooks for user-defined session handlers.\n[cjh] The bare-bones implementation of the Perms scheme, with a sql driver, works. If you pass it a full path it will traverse up it, returning the first permission it finds.\n[jon] Moved the language handling functions in Horde.php into their own classed named Lang.\n[cjh] More consistent/css-based look for the help system.\n[cjh] Starting to remove all uses of call-time pass-by-reference.\n[cjh] Added css.php for automagical generation of stylesheets for apps.\n[jon] Promoted the WebClient class from lib/Horde.php to its own component named Browser.php.\n[cjh] Use wordwrap in a slightly different way, which seems to produce much prettier quoting of messages.\n[jon] Added Prefs/mysql.php driver from Max Kalika <max@the-triumvirate.net>.\n[jon] New XML-based help subsystem.\n[cjh] Renamed package.horde.php to Horde.php.\n[cjh] Add img() and pimg() functions to the Horde:: class so that modules using only stylesheets don't need the HTMLDocument package.\n[cjh] Omit the session name/id from the URL if we can verify that cookies are being accepted.\n[jon] New wrap_message function that uses the native wordwrap function if it exists.\n[jon] Updating header comment copyright information.\n[jon] Report module versions in test.php output.\n[cjh] mime_encapsulate() now uses an array instead of an object.\n[jon] Removed the $_html['compose*'] sizing parameters from config/html.php.\n[cjh] Leave Bcc: out of the headers that are passed to sendmail.\n[jon] Rewrite a good portion of the scripts/set_perms.sh script so that it enforces an extremely high level of security.\n[cjh] The valid_lang() function now requires $nls['languages'][<language>] to be set for a language to be considered valid (instead of just the locale directory existing).\n[cjh] Added a &singleton() method to make it easier to only create one log instance, no matter when you need it.\n[cjh] Now mailfrom() works for recipient addresses with single quotes or other characters that need to be escaped in them.\n[cjh] Log class now has an mcal instance, a composite (for grouping multiple log backends), and observers register the level of events they want to hear about, and only get notified of events as important or more important than that level.\n[cjh] Added a Log:: framework and syslog implementation, including a Log_observer class intended to sit on top of Lob objects and take action in exceptional circumstances.\n[cjh] Make sure to always send a charset with emails.\n[cjh] Improved the mime_decode() and mime_encode() functions.\n[cjh] Updated test.php to recognize php4 stable releases.\n[jon] Removed all of the locale/*.lang dependencies.\n[jon] Assume the browser is frames-capable by default.\n[cjh] Add horde_cleanup($filename), which takes care of deleting files that should be unlinked regardless of whether or not the request is canceled by the user before we finish executing.\n[cjh] Remove phplib dependancy in favor of php4 sessions/PEAR.\n[cjh] Replace use with require_once.\n[cjh] Fixed up select_lang() to work (identical to 1.2 now)\n[cjh] Horde is now under the LGPL.\n[cjh] Fix mailfrom() so it doesn't send extra headers when using mail()\n[cjh] Adding a 'margins' attribute to HTMLDocument to enable turning off document margins.\n"
1.3.2:
  notes: "[cjh] Replaced module.XML_RDF.php with a working copy.\n"
1.3.1:
  notes: "[cjh] Revamped the MimeMessage class to be much smaller and simpler.\n[cjh] Replaced the MimePartData class with a set of functions that more cleanly and correctly implement the MIME standard.\n[cjh] select_lang() now checks for en when the browser requests en_GB, etc.\n[cjh] Replaced all calls to ereg* functions with preg* functions, for speed. Because of this we now require php 3.0.12 or later.\n"
1.3.0:
  notes: "[   ] German updated\n[   ] Fixed the broken 'back' link in setup.php3 for non-English users\n[   ] manager.php3, db.lib, and cohorts are now gone. They were all unmaintained, out of date, and not very useful. Various build scripts are updated to reflect this.\n[jon] Removed config/defaults.php3 in preference of horde.php3\n[   ] Fixed a setup.php3 bug where \" was used instead of ' for $default values (mike)\n[   ] New Finnish translations (Thanks to: leo.jaaskelainen@kolumbus.fi)\n[   ] Fixed lynx support issue with login.php3\n[   ] Fixed signup.php3 problems\n[   ] Fixed problem.php3 problems (lynx support)\n[   ] Added database creation scripts for building phplib complian tables\n[   ] Moved all documentation (except README and COPYING) into doc/ subdir\n[   ] Added a caching class so that caching can be turned on per page if needed\n"
1.1.1:
  notes: "[   ] Horde understands French (thanks to Mathieu Clabaut <clabault@multimania.com>)\n[   ] Major frameset redesign\n[   ] Auto registration/congiruation of modules\n"
1.0.3:
  notes: "[   ] Horde is now web surfable.\n[   ] Horde handles lynx (pseudoly)\n[   ] Extendable menus. (menu.txt in horde/config)\n[   ] Signup, problem reporting, help functions are now part of horde\n"

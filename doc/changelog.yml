  notes: "Original version string was 6.0.0alpha1\n[mjr] Add the activesync:no_gal permission.\n[jan] Add command line tool for backing up and restoring user data.\n[jan] Mark NULL result values in SQL shell.\n[mjr] Refactor the Metar weather block to use Horde_Service_Weather and remove PEAR_Services_Weather dependency.\n[jan] Add a weekly login task to check for newer versions.\n[mjr] Use more flexible Encryption property for Outlook Autodiscovery responses.\n[jan] Add hook to customize user names for DAV clients.\n[jan] Show users' full names in user lists.\n[jan] Only show languages on login page that are supported by the system (Request #10457).\n[jan] Add option to always lowercase user names after logging in.\n[jan] Add group caching.\n[mjr] Add configuration options for overriding maximum request window size for ActiveSync.\n[mjr] Added maps configuration (Bug #14168).\n[jan] Add 'status' argument to horde-db-migrate (Nicolas Rochelemagne <nicolas.rochelemagne@cpanel.net>).\n[mjr] Add option to display OpenWeatherMap's weather map to the weather block.\n[mjr] Add configuration switch for disabling maillog synchronization with EAS clients (Bug #13747).\n[jan] Add inverse tree icons.\n[mms] Add Hashtable Administration page.\n[mms] Add Cache Administration page.\n[mms] Add the 'time_format_mini' preference.\n[mjr] Display ActiveSync client lastSyncTime in user's timezone (Request #13200).\n"
